  padding: 11px;
  border-radius: 11px;
  font: 500 var(--zt-base) var(--zf);
  cursor: pointer;
  transition: background .15s, border-color .15s;
}

.zsc-keep {
  border: 1px solid var(--zd-accent);
  background: color-mix(in srgb, var(--zd-accent) 14%, transparent);
  color: var(--zd-accent-bright);
}

.zsc-keep:hover { background: color-mix(in srgb, var(--zd-accent) 24%, transparent); }

.zsc-retake {
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.03);
  color: var(--zp-dim);
}

.zsc-retake:hover { background: rgba(255,255,255,.08); color: var(--zp-text); }

.zsc-keep i, .zsc-retake i { margin-right: 6px; }

/* ==========================================================================
    16d.  MAPS
   ========================================================================== */

.zsmp-card {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 9px 11px;
  margin-bottom: 8px;
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 12px;
  background: rgba(255,255,255,.02);
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color .16s, background .16s;
}

.zsmp-card:hover { border-color: var(--zd-accent); background: rgba(255,255,255,.05); }

.zsmp-cardimg,
.zsmp-cardph {
  width: 62px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 8px;
  object-fit: cover;
  background: rgba(0,0,0,.3);
}

.zsmp-cardph {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--zp-faint);
  font-size: 17px;
}

.zsmp-cardmeta { flex: 1; min-width: 0; }
.zsmp-cardname { font: 500 var(--zt-md) var(--zf); color: var(--zp-text); }
.zsmp-cardsub { margin-top: 2px; font: 400 var(--zt-sm) var(--zf); color: var(--zp-faint); }

/*
 * The board.
 *
 * `position: relative` with the image at `width: 100%` and pins placed by
 * percentage is the whole trick: the same stored coordinates land correctly at
 * any width, and there is nothing to recompute when the panel resizes.
 */
.zsmp-board {
  position: relative;
  width: 100%;
  border: 1px solid var(--zp-line);
  border-radius: 12px;
  overflow: hidden;
  background: #030a0e;
}

.zsmp-img { display: block; width: 100%; height: auto; }

.zsmp-noimg {
  padding: 46px 20px;
  text-align: center;
  font: 400 var(--zt-sm) var(--zf);
  font-style: italic;
  color: var(--zp-faint);
}

.zsmp-pin {
  position: absolute;
  transform: translate(-50%, -100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--zd-accent-bright);
  font-size: 15px;
  cursor: pointer;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,.95));
  transition: transform .16s, color .16s;
}

.zsmp-pin:hover { transform: translate(-50%, -100%) scale(1.18); }
.zsmp-pin.on { color: var(--zd-gold-light); }
.zsmp-pin.on i { animation: zspinbob 1.4s ease-in-out infinite; }

@keyframes zspinbob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

.zsmp-pinlabel {
  padding: 1px 6px;
  border-radius: 8px;
  background: rgba(4,14,18,.86);
  font: 500 var(--zt-2xs) var(--zf);
  letter-spacing: .3px;
  color: var(--zp-text);
  white-space: nowrap;
}

.zsmp-note {
  margin-top: 10px;
  font: 400 var(--zt-sm)/var(--zt-lh) var(--zf);
  color: var(--zp-dim);
}

.zsmp-detail {
  margin-top: 12px;
  padding: 12px 14px;
  border: 1px solid var(--zd-accent);
  border-radius: 12px;
  background: color-mix(in srgb, var(--zd-accent) 7%, transparent);
}

.zsmp-dhead {
  font: 600 var(--zt-md) var(--zf);
  color: var(--zd-accent-bright);
}

.zsmp-dhead i { margin-right: 7px; }

.zsmp-dimg {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 0;
  border: 1px solid var(--zp-line);
  border-radius: 9px;
  overflow: hidden;
  background: none;
  cursor: zoom-in;
}

.zsmp-dimg img { display: block; width: 100%; height: auto; }

.zsmp-dnote {
  margin-top: 9px;
  font: 400 var(--zt-base)/var(--zt-lh) var(--zf);
  color: var(--zp-text);

}

/* --- delivery ticks --- */

/*
 * On the timestamp line rather than beside the bubble, because a bubble that is
 * three words wide has nowhere to put anything beside it.
 */
.zsm-tick {
  margin-left: 5px;
  font-size: 10px;
  color: var(--zp-faint);
  vertical-align: baseline;
}

.zsm-tick.on { color: var(--zd-accent); }
.zsm-tick.on i { margin-right: 3px; }

/* ==========================================================================
    17.  SETTINGS
   ========================================================================== */

.zsp-label {
  font: 600 var(--zt-2xs) var(--zm);
  letter-spacing: 2.2px;
  text-transform: uppercase;
  color: var(--zd-gold-dark);
  margin: 18px 0 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid rgba(200,160,48,.14);
}

.zsp-label:first-child { margin-top: 0; }

.zsp-input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 9px;
  background: rgba(0,0,0,.28);
  color: var(--zp-text);
  font: 400 var(--zt-md) var(--zf);
  transition: border-color .15s;
}

.zsp-input::placeholder { color: var(--zp-faint); }
.zsp-input:focus { border-color: var(--zd-accent); outline: none; }

.zsp-hint {
  font: 400 var(--zt-sm) var(--zf);
  color: var(--zp-faint);

}

.zsp-swatches {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.zsp-swatch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 4px 8px;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 10px;
  background: rgba(255,255,255,.02);
  cursor: pointer;
  transition: border-color .16s, background .16s, transform .16s;
}

.zsp-swatch:hover { transform: translateY(-2px); background: rgba(255,255,255,.05); }

.zsp-swatch.on {
  border-color: var(--sw);
  background: rgba(255,255,255,.06);
  box-shadow: 0 0 16px -6px var(--sw);
}

.zsp-swdot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, #fff, var(--sw) 46%, var(--swd));
  box-shadow: 0 0 12px -3px var(--sw);
}

.zsp-swname {
  font: 500 var(--zt-xs) var(--zf);
  letter-spacing: .5px;
  color: var(--zp-dim);
}

.zsp-swatch.on .zsp-swname { color: var(--zp-text); }

/* --- toggle switch, over a real checkbox --- */

.zsp-toggle {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 2px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,.04);
}

.zsp-tbox {
  position: absolute;
  opacity: 0;
  width: 36px;
  height: 20px;
  margin: 0;
  cursor: pointer;
}

.zsp-track {
  position: relative;
  width: 36px;
  height: 20px;
  flex-shrink: 0;
  border-radius: 10px;
  background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.08);
  transition: background .2s, border-color .2s;
}

.zsp-track::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--zp-dim);
  transition: transform .2s cubic-bezier(.34,1.4,.64,1), background .2s;
}

.zsp-tbox:checked + .zsp-track {
  background: color-mix(in srgb, var(--zd-accent) 30%, transparent);
  border-color: var(--zd-accent);
}

.zsp-tbox:checked + .zsp-track::after {
  transform: translateX(16px);
  background: var(--zd-accent);
}

.zsp-tlabel { font: 400 var(--zt-md) var(--zf); color: var(--zp-text); }

.zsp-danger {
  width: 100%;
  margin-top: 12px;
  padding: 9px;
  border: 1px solid rgba(224,96,96,.28);
  border-radius: 9px;
  background: rgba(224,96,96,.07);
  color: #e08080;
  font: 500 var(--zt-base) var(--zf);
  cursor: pointer;
  transition: background .15s, color .15s;
}

.zsp-danger:hover { background: rgba(224,96,96,.16); color: #f0a0a0; }

/* ==========================================================================
    18.  ALERTS  (the notification centre, now an app)
   ========================================================================== */

/*
 * A row is a wrapper, not a button.
 *
 * It used to be a single <button>, which left nowhere valid to put a per-row
 * dismiss control -- a button inside a button is invalid markup that browsers
 * resolve by silently dropping one of them. The tappable part and the x are now
 * siblings inside a plain div.
 */
.zsy-row {
  display: flex;
  align-items: stretch;
  gap: 4px;
  margin-bottom: 8px;
  border: 1px solid rgba(255,255,255,.05);
  border-radius: 10px;
  background: rgba(255,255,255,.028);
  transition: background .15s, border-color .15s;
}

.zsy-row:hover { background: rgba(255,255,255,.055); border-color: rgba(200,160,48,.18); }

/* An unread alert carries an accent edge, the way an unread thread does. */
.zsy-row.zsy-new { border-left: 2px solid var(--zd-accent); }

.zsy-open {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 12px 4px 12px 13px;
  border: 0;
  background: none;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.zsy-open.zsy-flat { cursor: default; }

/* The per-row dismiss. Bulk "Clear log" is still at the bottom of the list. */
.zsy-x {
  flex-shrink: 0;
  width: 34px;
  border: 0;
  border-radius: 0 9px 9px 0;
  background: none;
  color: var(--zp-faint);
  font-size: var(--zt-base);
  cursor: pointer;
  transition: color .15s, background .15s;
}

.zsy-x:hover { color: #e06060; background: rgba(224,48,48,.1); }

.zsy-icon { color: var(--zd-accent); font-size: var(--zt-md); margin-top: 2px; flex-shrink: 0; }

.zsy-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

.zsy-title { font: 500 var(--zt-md) var(--zf); color: var(--zp-text); }

.zsy-body {
  font: 400 var(--zt-base)/1.45 var(--zf);
  color: var(--zp-faint);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.zsy-age {
  flex-shrink: 0;
  align-self: flex-start;
  padding-top: 2px;
  font: 400 var(--zt-xs) var(--zm);
  color: var(--zp-faint);
}

/* ==========================================================================

.zsk-cards {

}

/*
 * One card per configured currency, tinted from the currency's own colour so

 */
.zsk-card {

/* ==========================================================================
    19.  LIGHTBOX
   ========================================================================== */

#zs-lightbox {
  position: fixed;
  inset: 0;
  z-index: var(--zz-lightbox);
  font-family: var(--zf);
  font-size: var(--zt-base);
  line-height: var(--zt-lh);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.86);
  backdrop-filter: blur(6px);
  animation: zsfin .18s;
  cursor: zoom-out;
}

.zslb-wrap { position: relative; max-width: 88vw; max-height: 88vh; }

.zslb-img {
  max-width: 88vw;
  max-height: 82vh;
  display: block;
  border-radius: 8px;
  border: 1px solid var(--zp-line);
  box-shadow: 0 20px 60px rgba(0,0,0,.7);
}

/*
 * Inside the image, not floating off its corner.
 *
 * Same shape of problem as `.zsu-close`: at `-16px` it sat outside
 * `.zslb-wrap`, and with the wrap already capped at 88vw / 88vh a wide image on
 * a narrow window pushed the button off the edge of the viewport. Inset over the
 * image's own top-right corner, it is always reachable, and the backdrop is
 * click-to-close anyway.
 */
.zslb-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--zp-line);
  background: rgba(10,22,28,.86);
  color: var(--zp-text);
  font: 300 22px/1 var(--zf);
  cursor: pointer;
  transition: color .15s, transform .15s, background .15s;
}

.zslb-close:hover { color: var(--zd-accent); transform: rotate(90deg); }

.zslb-cap {
  margin-top: 10px;
  text-align: center;
  font: 400 var(--zt-md) var(--zf);
  color: #c0cccc;
}

/*
 * What you can do to the image you are looking at.
 *
 * Inside `.zslb-wrap`, under the picture, for the same reason `.zslb-close` is
 * inside it: the wrap is already capped at 88vw/88vh, and anything hung outside
 * that box can be pushed off the viewport by a wide image on a narrow window.
 */
.zslb-actions {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
  cursor: auto;
}

.zslb-act {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border: 1px solid var(--zp-line);
  border-radius: 20px;
  background: rgba(10,22,28,.9);
  color: var(--zp-text);
  font: 500 var(--zt-sm) var(--zf);
  cursor: pointer;
  transition: border-color .15s, background .15s, color .15s;
}

.zslb-act:hover { border-color: var(--zd-accent); color: var(--zd-accent-bright); background: rgba(14,34,42,.95); }

.zslb-danger { color: #e08080; border-color: rgba(224,96,96,.3); }
.zslb-danger:hover { color: #f0a0a0; border-color: #e06060; background: rgba(40,14,14,.9); }

/* The share picker, hung off the lightbox rather than the device. */
.zslb-picker {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  width: min(340px, 88vw);
  max-height: 78vh;
  overflow-y: auto;
  padding: 12px;
  border: 1px solid var(--zp-line);
  border-radius: 14px;
  background: #0b1a21;
  box-shadow: 0 20px 60px rgba(0,0,0,.75);
  cursor: auto;
  animation: zsvInX .16s ease both;
}

.zslb-send {

  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: 1px solid var(--zd-accent);
  border-radius: 10px;
  background: color-mix(in srgb, var(--zd-accent) 14%, transparent);
  color: var(--zd-accent-bright);
  font: 500 var(--zt-base) var(--zf);
  cursor: pointer;
  transition: background .15s;
}

.zslb-send:hover { background: color-mix(in srgb, var(--zd-accent) 26%, transparent); }

/* ==========================================================================
    20b.  CAPTURE SWEEP  (GM only)

/*
 * Its own overlay rather than a tab in the Command Center: the list can be forty
 * rows long with a thumbnail each, which is not something a 480px panel column
 * should be asked to hold.
 */
#zs-sweep {
  position: fixed;
  inset: 0;
  z-index: var(--zz-lightbox);
  display: flex;
  align-items: center;
  justify-content: center;

}

}

/* ==========================================================================
    21.  ACCESSIBILITY & MOTION
   ========================================================================== */

/*
 * Keyboard focus. v1.6 removed focus rings with `outline: none` in five places
 * and put nothing back, which made the whole device unusable without a mouse.
 * Rings are now scoped to :focus-visible, so they appear for keyboard users and
 * stay out of the way of mouse users.
 */
#zs-ui :focus-visible,
#zs-gm :focus-visible,
#zs-icon :focus-visible,
#zs-lightbox :focus-visible,
.zs-toast:focus-visible {
  outline: 2px solid var(--zd-accent);
  outline-offset: 2px;
  border-radius: 6px;
}

/* Buttons inherit the device's type rather than the browser's */
#zs-ui button,
#zs-gm button { font-family: var(--zf); }

/*
 * Form controls size to their border box.
 *
 * Every full-width field in the device is `width: 100%` with its own padding
 * and a 1px border, which under the default `content-box` makes it 27px wider
 * than its container -- so the right border of the device-name field, the reply
 * composer and the contact notes textarea were all sliced off by the scroller's
 * `overflow-x: hidden`. Caught by measuring the rendered page, not by the test
 * suite, which asserts structure and has nothing to say about geometry.
 *
 * Scoped to form controls rather than applied blanket, so the tuned padding on
 * the rest of the stylesheet keeps the box it was tuned against.
 */
#zs-ui input,
#zs-ui textarea,
#zs-ui select,
#zs-gm input,
#zs-gm textarea,
#zs-gm select { box-sizing: border-box; max-width: 100%; }

/*
 * Reduced motion. The OS setting is honoured here; the Settings app's own
 * toggle adds .zs-calm, and both land in the same place. The infinite orb
 * animation, the unfurl, the sweep and every view transition stop; opacity
 * fades that carry no movement are left alone.
 */
@media (prefers-reduced-motion: reduce) {
  #zs-icon,
  #zs-ui,
  #zs-gm,
  #zs-lightbox,
  #zs-toasts * {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }

  #zs-icon *,
  #zs-ui * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }

  .zsu-frame,
  .zsu-emitter,
  .zsu-sweep,
  .zsi-stone-halo,
  .zsl-openglow { animation: none !important; }

  .zsu-sweep { display: none; }
  #zs-icon:hover { transform: none; }
}

#zs-ui.zs-calm .zsu-frame,
#zs-ui.zs-calm .zsu-emitter,
#zs-ui.zs-calm .zsu-sweep,
#zs-ui.zs-calm .zsl-openglow,
#zs-ui.zs-calm .zsm-msg { animation: none !important; }

/*
 * The view transitions stop here too. Without this the class only silenced the
 * chrome, so switching the toggle on mid-slide left the outgoing view running
 * its `zsvOut*` to completion over the top of the incoming one. ScrollUI.setCalm
 * strips the leftover classes on the JS side; this is what makes the rule true
 * for a view that is animating at the moment the class lands.
 */
#zs-ui.zs-calm .zsu-view { animation: none !important; }

#zs-ui.zs-calm .zsu-sweep { display: none; }

#zs-ui.zs-calm .zsn-app:hover,
#zs-ui.zs-calm .zsr-vn-circle:hover,
#zs-ui.zs-calm .zsx-item:hover { transform: none; }

#zs-ui.zs-calm .zslb-picker,
#zs-lightbox.zs-calm .zslb-picker { animation: none !important; }

/*
 * The darkroom shimmer is decoration; the spinner is not — it is the only thing
 * saying the photo is still in flight. Calm mode stops the sweep and leaves the
 * spinner turning, slowly.
 */
#zs-ui.zs-calm .zsx-dev::after { animation: none; background: rgba(0,0,0,.4); }
#zs-ui.zs-calm .zsx-devspin { animation-duration: 2.4s; }

#zs-ui.zs-calm .zsmp-pin:hover { transform: translate(-50%, -100%); }
#zs-ui.zs-calm .zsmp-pin.on i { animation: none; }

/* ==========================================================================
    22.  RESPONSIVE
   ========================================================================== */

/*
 * The panel is a fixed portrait column, so the only thing that has to give is
 * height.
 *
 * The container queries are the important half. `.zsu-screen` declares
 * `container-type: size`, so these read the *panel's* height -- which is what
 * the lock screen actually lives inside. The old viewport media queries missed
 * exactly the case that broke it: a window tall enough not to trigger them,
 * holding a panel clamped to 92vh, whose lock screen was still too tall for its
 * own fixed 44px padding, 68px clock and 22px rule margins.
 *
 * `.zsl-wrap` scrolls as a floor under all of this, so even a container query
 * that misses cannot clip the unlock button any more.
 */
@container zsscreen (max-height: 760px) {
  .zsl-wrap { padding-top: 30px; }
  .zsl-clock { font-size: 54px; }
  .zsl-rule { margin: 15px 0 2px; }
  .zsl-event { margin-top: 11px; padding: 10px 18px; }
  .zsl-pills { margin-top: 12px; }
  .zsn-head { padding-top: 12px; }
}

@container zsscreen (max-height: 620px) {
  .zsl-wrap { padding-top: 20px; gap: 2px; }
  .zsl-clock { font-size: 42px; }
  .zsl-device { margin-bottom: 7px; }
  .zsl-date { margin-top: 3px; }
  .zsl-rule { margin: 10px 0 2px; }
  .zsl-event { margin-top: 8px; padding: 8px 16px; }
  .zsl-pills { margin-top: 9px; }
  .zsl-open { padding: 10px 24px 0; gap: 8px; }
  .zsl-openglow { width: 36px; height: 36px; }
  .zsn-tile { width: 54px; height: 54px; font-size: 21px; }
  .zsn-grid { gap: 10px; }
  .zsh-portrait { width: 66px; height: 66px; }
}

/*
 * Viewport height, kept as a backstop for browsers without container queries.
 * Foundry v13 ships Chromium well past their support cut-off, so in practice
 * this never fires first -- but it costs nothing and it fails the right way.
 */
@media (max-height: 820px) {
  .zsl-rule { margin: 16px 0 2px; }
  .zsn-head { padding: 12px 50px 8px 18px; }
}

@media (max-height: 680px) {
  .zsl-device { margin-bottom: 8px; }
  .zsl-pills { margin-top: 12px; }
}

/* Narrow viewports: the grid loses a column before the tiles get cramped */
@media (max-width: 520px) {
  .zsu-frame { width: 100%; height: 94vh; max-height: 94vh; }
  .zsn-grid,
  .zsr-vn-grid { grid-template-columns: repeat(3, 1fr); }
  .zsp-swatches { grid-template-columns: repeat(2, 1fr); }
  .zsx-grid { grid-template-columns: repeat(2, 1fr); }
  .zsc-view { aspect-ratio: 4 / 3; }
  .zsq-tab { font-size: var(--zt-sm); }
  .zsmp-pinlabel { display: none; }
  .zsk-cards { grid-template-columns: 1fr; }
}

/* The Command Center is a form stack; it can simply narrow */
@media (max-width: 720px) {
  .zg-row { flex-direction: column; align-items: stretch; gap: 5px; }
  .zg-row label { width: auto; }
  .zg-arow { flex-wrap: wrap; }
  .zgt-board { height: 60vh; }
}

/* ==========================================================================
    22b.  THE GIFT TREE EDITOR
   ========================================================================== */

/*
 * The board is a percentage coordinate space, exactly like the map preview it
 * is modelled on: a node's x/y are percentages, so the board can be any size
 * and the same tree reads correctly here and on the 480px device panel.
 *
 * Its height is viewport-relative rather than fixed. A tree is authored by
 * looking at its shape, and a 300px letterbox is not a shape you can judge.
 */

.zg-subtabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}

.zg-subtab {
  padding: 6px 13px;
  border: 1px solid var(--zp-line);
  border-radius: 999px;
  background: rgba(0,0,0,.25);
  color: var(--zp-dim);
  font: 500 var(--zt-sm) var(--zf);
  cursor: pointer;
}

.zg-subtab.active {
  border-color: var(--zd-accent-deep);
  background: rgba(80,216,232,.12);
  color: var(--zd-accent-bright);
}

.zgt-board {
  position: relative;
  height: 46vh;
  min-height: 280px;
  margin: 10px 0 14px;
  border: 1px solid var(--zp-line);
  border-radius: 10px;
  overflow: hidden;
  background:
    linear-gradient(rgba(200,160,48,.05) 1px, transparent 1px) 0 0 / 100% 10%,
    linear-gradient(90deg, rgba(200,160,48,.05) 1px, transparent 1px) 0 0 / 10% 100%,
    #030a0e;
}

/* While an edge is being dragged, every node is a target and should say so. */
.zgt-board.linking .zgt-node { cursor: crosshair; }

/*
 * The coordinate space, inset by half a node.
 *
 * A node is centred on its own percentage and carries a link handle 9px below
 * it and a grant badge 6px above, so a node at 0% or 100% would have half of
 * itself outside the board — and the board hides overflow to keep its rounded
 * border. The inset leaves 0-100 meaning exactly what it means on the device;
 * it only stops the extremes being unreachable. Edges live in here too, or the
 * lines would not meet the nodes they join.
 */
.zgt-stage {
  position: absolute;
  inset: 42px 72px;
}

.zgt-edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.zgt-edge {
  stroke: var(--zd-accent-deep);
  stroke-width: .35;
  vector-effect: non-scaling-stroke;
  pointer-events: none;
}

/*
 * The click target for deleting an edge. Invisible and fat, because a stroke
 * thin enough to look right is far too thin to hit.
 */
.zgt-hit {
  stroke: transparent;
  stroke-width: 10;
  vector-effect: non-scaling-stroke;
  pointer-events: stroke;
  cursor: pointer;
}

.zgt-hit:hover + .zgt-edge { stroke: var(--zd-gold-light, #e8c76a); }

.zgt-ghost {
  stroke: var(--zd-accent-bright);
  stroke-width: 2;
  stroke-dasharray: 5 4;
  vector-effect: non-scaling-stroke;
  pointer-events: none;
}

.zgt-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 74px;
  max-width: 120px;
  padding: 7px 9px;
  border: 1px solid var(--zp-line);
  border-radius: 10px;
  background: linear-gradient(180deg, var(--zp-panel-2), var(--zp-panel));
  color: var(--zp-text);
  font: 500 var(--zt-sm)/1.25 var(--zf);
  text-align: center;

/* ==========================================================================
    23.  FOUNDRY CORE CSS  —  containment
   ========================================================================== */

/*
 * The device does not live in a document of its own. It is appended to
 * `document.body` inside a running Foundry client, and Foundry's `foundry2.css`
 * styles bare *element* selectors globally -- `button`, `input`, `textarea`,
 * `select`, `h1`-`h6` -- with no scoping that would keep it out of a module's
 * own DOM. Every one of those elements in the scroll was therefore being sized
 * by Foundry, not by this stylesheet.
 *
 * The damage was concentrated in one rule:
 *
 *     a.button, button {
 *       height:      var(--button-size);   ... where --button-size is 2em
 *       min-height:  var(--button-size);
 *       line-height: normal;
 *       font-size:   var(--font-size-14);
 *       ...
 *     }
 *
 * This stylesheet never declares `height`, `min-height`, `line-height` or
 * `font-size` on a button -- it had no reason to, since buttons size to their
 * content -- so those four fell through to Foundry unopposed and every button
 * in the device was clamped to a flat 2em box regardless of what was inside it.
 * `.zsl-open` needs 34px for its glow and its caption and was given 27, which
 * is why TOUCH THE STONE sat outside its own rectangle; the home grid's
 * `.zsn-app` needs 38 and was given 28, which is why the tiles crowded the row
 * beneath them. Every app screen with buttons in a stack had the same fault,
 * which is exactly the "everything encroaches on the thing above and below it"
 * report -- and the notice board was the one screen that looked right because
 * it is the one screen built from divs.
 *
 * WHY `:where()`
 *
 * Foundry declares a layer order and puts all of the above inside it. An
 * unlayered rule beats a layered rule outright, whatever the specificity on
 * either side, so a *zero-specificity* unlayered selector is enough to take
 * these properties back -- and being zero-specificity it then loses to every
 * ordinary rule in this stylesheet, including bare class selectors like
 * `.zsl-open`. That is the property that matters: this section restores the
 * defaults the device was designed against and then gets out of the way. A
 * conventional `#zs-ui button { ... }` would have won these fights too, and
 * would also have overridden the module's own `.zsl-open` and `.zsn-app`.
 *
 * Nothing here is styling. It is only the removal of styling that should never
 * have arrived. Keep it that way: a real rule belongs in its own section.
 */

:where(#zs-icon, #zs-ui, #zs-gm, #zs-toasts, #zs-lightbox),
:where(#zs-icon, #zs-ui, #zs-gm, #zs-toasts, #zs-lightbox) :where(*, *::before, *::after) {
  box-sizing: border-box;
}

/*
 * Buttons size to their content again.
 *
 * `display`/`justify-content`/`align-items`/`gap` are deliberately left as
 * Foundry sets them. A centred flex box with a small gap is what almost every
 * button in the device wants anyway -- the icon-and-label buttons in the
 * command centre have no gap of their own and read as `[icon]Save` without it
 * -- and the ones that want otherwise say so themselves. This section removes
 * damage, not defaults.
 */
:where(#zs-icon, #zs-ui, #zs-gm, #zs-toasts, #zs-lightbox) :where(button) {
  height: auto;
  min-height: 0;
  max-height: none;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  color: inherit;
  font: inherit;
  line-height: inherit;
  text-align: inherit;
  transition: none;
  cursor: pointer;
}

/*
 * Foundry makes every child of a button `pointer-events: none` so its own
 * handlers always see the button. The device reads `event.target` in places and
 * has its own hover states on button children, so that goes back too.
 */
:where(#zs-icon, #zs-ui, #zs-gm, #zs-toasts, #zs-lightbox) :where(button) > * {
  pointer-events: auto;
}

/*
 * Fields keep their own box. Foundry pins text inputs and selects to a fixed
 * `--input-height` with a matching `line-height`, and gives every textarea a
 * 60px floor in a monospace face.
 */
:where(#zs-icon, #zs-ui, #zs-gm, #zs-toasts, #zs-lightbox)
  :where(input, select, textarea) {
  height: auto;
  min-height: 0;
  width: auto;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
  outline: none;
  color: inherit;
  font: inherit;
  line-height: inherit;
}

/* Headings are typography here, not Foundry's document headings. */
:where(#zs-icon, #zs-ui, #zs-gm, #zs-toasts, #zs-lightbox)
  :where(h1, h2, h3, h4, h5, h6) {
  margin: 0;
  font: inherit;
  line-height: inherit;
  color: inherit;
}

/* Lists in the device are layout, never bulleted document lists. */
:where(#zs-icon, #zs-ui, #zs-gm, #zs-toasts, #zs-lightbox) :where(ul, ol) {
  margin: 0;
  padding: 0;
  list-style: none;
}

:where(#zs-icon, #zs-ui, #zs-gm, #zs-toasts, #zs-lightbox) :where(p) { margin: 0; }
