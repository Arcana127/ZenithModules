<!doctype html>
<meta charset="utf-8">
<title>Zenith Scroll — view preview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/*
 * Foundry VTT core CSS — the part of it that reaches into a module's own DOM.
 *
 * WHY THIS FILE EXISTS
 *
 * `render-preview.mjs` used to render the device against the module stylesheet
 * and nothing else, so the preview was a *more forgiving* environment than the
 * one the module actually ships into. Every button in the device came out the
 * right size in the preview and was crushed to 2em in Foundry, because Foundry
 * styles the bare `button` element globally and the preview had no opinion.
 * "Touch the stone" spilling out of its own box is the same bug seen from the
 * player's chair.
 *
 * This is a transcription of the rules in `foundry2.css` (v14.367) whose
 * selectors are bare element names, so they match inside `#zs-ui` and `#zs-gm`
 * whether Foundry means them to or not. It is deliberately NOT the whole file:
 * everything Foundry scopes to `.application`, `.app`, `#interface` &c. cannot
 * reach the device and would only be noise here.
 *
 * The `@layer` wrapper is load-bearing, not decoration. Foundry declares its
 * layer order up front and puts all of this inside it, and an *unlayered* rule
 * beats a layered one no matter how specific the layered one is. That is the
 * whole reason section 23 of the module stylesheet can neutralise this with
 * zero-specificity `:where()` selectors: they are unlayered, so they win, and
 * being zero-specificity they still lose to every real rule in the module.
 * Drop the `@layer` here and the preview would show the module losing fights
 * it actually wins.
 *
 * Keep this in step with Foundry on a major version bump. The check is
 * mechanical: diff the `reset`, `elements.typography` and `elements.forms`
 * layers of `foundry2.css` for rules with bare element selectors.
 */

@layer reset, variables, elements, blocks, applications, compatibility,
       layouts, system, modules, exceptions;

@layer reset {
  *,
  *::before,
  *::after { box-sizing: border-box; }

  body {
    width: 100%;
    margin: 0;
    text-rendering: optimizeSpeed;
    line-height: 1.25;
    user-select: none;
  }

  body, h1, h2, h3, h4, p, figure, blockquote, dl, dd { margin: 0; }

  ul[role="list"], ol[role="list"] { list-style: none; }

  img { max-width: 100%; display: block; }

  input, button, textarea, select { font: inherit; }
}

@layer variables.base {
  :root {
    --font-size-14: 0.875rem;
    --font-sans: "Signika", ui-sans-serif, sans-serif;
    --font-monospace: monospace;
    --font-h1: var(--font-sans);
    --font-h2: "Amiri", serif;
    --font-h3: var(--font-sans);
    --font-h4: var(--font-sans);
    --font-h1-size: 2.5rem;
    --font-h2-size: 2rem;
    --font-h3-size: 1.5rem;
    --font-h4-size: 1.25rem;
    --input-height: 2rem;
    --input-background-color: rgba(0, 0, 0, 0.35);
    --input-border-color: #7a7971;
    --input-text-color: #eee;
    --input-box-shadow: none;
    --color-text-primary: #b5b3a4;
    --color-text-emphatic: #f7f3e8;
    --cursor-text: text;
    --cursor-pointer: pointer;
  }

  /*
   * Foundry sizes the interface off the body, not the root. 15px/1.25 is what
   * the device actually inherits, and it is the reason a module rule that omits
   * `font-size` does not get 16px.
   */
  body {
    font-family: var(--font-sans);
    font-size: 15px;
  }
}

@layer elements.typography {
  h1, h2, h3, h4, h5, h6 {
    margin: 2rem 0 1rem;
    line-height: 1;
  }

  h1:first-child, h2:first-child, h3:first-child,
  h4:first-child, h5:first-child, h6:first-child { margin-top: 0; }

  h1 { font-family: var(--font-h1); font-size: var(--font-h1-size); color: var(--color-text-emphatic); }
  h2 { font-family: var(--font-h2); font-size: var(--font-h2-size); color: var(--color-text-emphatic); }
  h3 { font-family: var(--font-h3); font-size: var(--font-h3-size); color: var(--color-text-primary); }
  h4 { font-family: var(--font-h4); font-size: var(--font-h4-size); color: var(--color-text-primary); }
}

@layer elements.forms {
  input[type=text],
  input[type=number],
  input[type=password],
  input[type=date],
  input[type=time],
  input[type=datetime-local],
  input[type=search],
  input[type=file],
  select {
    width: 100%;
    height: var(--input-height);
    line-height: var(--input-height);
    padding: 0 0.5rem;
    background: var(--input-background-color);
    border: 1px solid var(--input-border-color);
    border-radius: 4px;
    box-shadow: var(--input-box-shadow);
    outline: 1px solid transparent;
    font-family: inherit;
    font-size: inherit;
    color: var(--input-text-color);
    user-select: text;
    transition: outline-color 0.5s;
    cursor: var(--cursor-text);
  }

  textarea {
    min-height: 60px;
    padding: 0.25rem 0.5rem;
    background: var(--input-background-color);
    border: 1px solid var(--input-border-color);
    border-radius: 4px;
    font-family: var(--font-monospace);
    font-size: var(--font-size-14);
    color: var(--input-text-color);
    user-select: text;
  }

  input[type="checkbox"], input[type="radio"] { appearance: none; }

  /*
   * The rule that did the damage. `height` AND `min-height` AND `line-height`
   * AND `font-size`, on the bare element, for every button in the document.
   */
  a.button,
  button {
    --button-size: 2em;
    --button-background-color: rgba(0, 0, 0, 0.35);
    --button-border-color: #7a7971;
    --button-text-color: #ccc;

    display: flex;
    justify-content: center;
    align-items: center;
    height: var(--button-size);
    min-height: var(--button-size);
    gap: 0.25rem;
    padding: 0 0.5rem;
    background: var(--button-background-color);
    border: 1px solid var(--button-border-color);
    border-radius: 4px;
    color: var(--button-text-color);
    font-family: var(--font-sans);
    font-size: var(--font-size-14);
    line-height: normal;
    text-decoration: none;
    cursor: var(--cursor-pointer);
    transition: 0.5s;
  }

  a.button > *,
  button > * { pointer-events: none; }
}

</style>
<style>
/*
 * Zenith Academy Scroll — stylesheet  (v1.8)
 *
 * The device is a bracelet that projects a screen. That is the whole design
 * brief, and it decides everything below:
 *
 *   - The bracelet is metal and gemstone: gradients, specular highlights, weight.
 *   - The projection is LIGHT, not glass. No bezel, no metal frame, no drop
 *     shadow — an emitted panel has a bloom, a hairline edge and a faint haze,
 *     and it sits in a portrait column because that is the shape a handheld
 *     interface wants.
 *
 * Palette is teal/gold/dark as always, but the teal is now an *accent token*
 * the student picks in Settings, so two scrolls open side by side read as two
 * different devices. Everything tinted reads --zd-accent; nothing hardcodes it.
 *
 * Every text size names a step on the type scale in section 1. Nothing here
 * should carry a raw pixel font size again: the only survivors are icon glyph
 * sizes and line-heights, which are not type.
 *
 * Class prefixes:
 *   zsi-  bracelet icon      zsu-  projection frame / chrome
 *   zsb-  notice board       zsl-  lock screen      zsn-  home screen
 *   zsh-  student ID         zss-  schedule         zsg-  gift
 *   zsm-  messages           zsx-  gallery          zsr-  contacts
 *   zsk-  bank               zsp-  settings         zsy-  alerts
 *   zsq-  notes              zsc-  camera           zsw-  capture sweep
 *   zsmp- maps               zgm-  GM map editor    zgq-  GM message queue
 *   zst-  toasts             zslb- lightbox         zg-   GM command center
 */

/* ==========================================================================
    1.  FONTS & DESIGN TOKENS
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* --- bracelet metal --- */
  --zd-body: #4a5e70;
  --zd-body-light: #6a7e90;
  --zd-body-dark: #354858;
  --zd-frame: #8090a0;
  --zd-frame-light: #a0aab5;

  /* --- gold --- */
  --zd-gold: #c8a030;
  --zd-gold-light: #e0c050;
  --zd-gold-dark: #9a7020;

  /* --- accent: overwritten per student on #zs-icon and #zs-ui --- */
  --zd-accent: #50d8e8;
  --zd-accent-deep: #1c7f8e;
  --zd-accent-bright: #a6f2fb;

  /* --- projection interior --- */
  --zp-ink: #040d12;
  --zp-panel: #08161d;
  --zp-panel-2: #0c1f28;
  --zp-line: rgba(200,160,48,.22);
  --zp-text: #d6e4e6;
  --zp-dim: #7d939a;
  --zp-faint: #52676e;

  /* --- type --- */
  --zf: 'Outfit','Segoe UI',sans-serif;
  --zm: 'JetBrains Mono','Consolas',monospace;

  /*
   * Type scale.
   *
   * The stylesheet used to carry 121 font declarations across about twenty
   * distinct pixel values (12.5, 11, 10, 9.5, 9, 8.5 ...), which meant "make the
   * text bigger" was twenty separate decisions and any one of them could drift.
   * Every text size now names a step here, and the scale is raised in one place.
   *
   * v1.8 raised it by roughly +1 at the small end and more at the top. Nothing
   * sits below 10px any more: the micro-labels at 8-8.5px were the worst of the
   * old sizes and are the main reason the device read as cramped.
   */
  --zt-2xs: 10px;      /* micro labels: NEXT, DORMITORY, category headers */
  --zt-xs: 11px;       /* small labels and metadata */
  --zt-sm: 12px;       /* secondary text */
  --zt-base: 13px;     /* body */
  --zt-md: 14px;       /* emphasised body, message bubbles */
  --zt-lg: 16px;       /* subheads, app bar titles */
  --zt-xl: 19px;       /* screen heads */
  --zt-2xl: 22px;      /* display heads */
  --zt-display: 68px;  /* the lock screen clock, and only that */

  /*
   * Line height.
   *
   * The stylesheet used to declare a line-height in four places and inherit the
   * rest, which meant the device was reading Foundry's `body { line-height:
   * 1.25 }` -- a number chosen for Foundry's sheets, not for 11-13px UI text in
   * a narrow column, and one that moves whenever Foundry retunes it. Anything
   * that can wrap (message bubbles, notice bodies, event descriptions) was
   * being set solid enough that two lines read as one block.
   *
   * --zt-lh is the body value and the device's default. --zt-lh-tight is for
   * type that is display-sized or known to be one line, where 1.5 would just
   * add slack above and below a single row.
   */
  --zt-lh: 1.5;
  --zt-lh-tight: 1.25;

  /*
   * Panel geometry, so the responsive rules and the JS both have one number to
   * read rather than four copies of it.
   */
  --zs-panel-w: 480px;
  --zs-panel-h: 880px;

  /*
   * Z-index ladder. Previously ad hoc (0,1,2,3,5,10,20,90,200,210,250,300),
   * which is how the bracelet ended up *below* Foundry's own sheets. Foundry
   * hands application windows an incrementing z-index, so the device sits well
   * clear of that range rather than a few steps above it.
   */
  --zz-icon: 150;
  --zz-toast: 210;
  --zz-ui: 220;
  --zz-gm: 230;
  --zz-lightbox: 260;
}

/* ==========================================================================
    2.  THE BRACELET
   ========================================================================== */

#zs-icon {
  position: fixed;
  bottom: 84px;
  left: 18px;
  z-index: var(--zz-icon);
  cursor: pointer;
  user-select: none;
  touch-action: none;
  transition: transform .22s cubic-bezier(.34,1.4,.64,1), filter .22s;
}

#zs-icon:hover { transform: scale(1.08) rotate(-2deg); }
#zs-icon:active { transform: scale(1.02); }

.zsi-device {
  position: relative;
  width: 64px;
  height: 64px;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,.55));
}

.zsi-svg { display: block; overflow: visible; }

/* The stone breathes. This is the module's one infinite animation, and the
   reduced-motion block at the bottom kills it. */
.zsi-stone { filter: drop-shadow(0 0 5px var(--zd-accent)); }

.zsi-stone-halo {
  transform-origin: 32px 35px;
  animation: zsi-breathe 3.4s ease-in-out infinite;
}

@keyframes zsi-breathe {
  0%, 100% { opacity: .16; transform: scale(1); }
  50%      { opacity: .38; transform: scale(1.18); }
}

.zsi-chip { fill: var(--zd-accent-deep); opacity: .85; }

/* Soft field of light around the stone, sitting under the SVG */
.zsi-emit {
  position: absolute;
  left: 50%;
  top: 55%;
  width: 46px;
  height: 46px;
  transform: translate(-50%,-50%);
  border-radius: 50%;
  background: radial-gradient(circle, var(--zd-accent) 0%, transparent 68%);
  opacity: .22;
  pointer-events: none;
  z-index: -1;
}

#zs-icon:hover .zsi-emit { opacity: .4; }

/* The hit target is a real button so the device is keyboard-reachable */
.zsi-hit {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: none;
  border: 0;
  border-radius: 50%;
  padding: 0;
  cursor: pointer;
  color: transparent;
}

/*
 * The label under the bracelet.
 *
 * It was #9a7020 at .75 opacity and 7px -- dim gold on whatever the scene
 * happens to be, which on a bright map is close to invisible. Near-white at
 * full opacity with a hard shadow reads over *any* background rather than only
 * dark ones, which is the point: the bracelet sits on the canvas, and the
 * canvas is not ours to control.
 */
.zsi-label {
  font: 600 var(--zt-2xs) var(--zf);
  letter-spacing: 3.2px;
  text-transform: uppercase;
  color: #eaf6f7;
  text-align: center;
  margin: 2px -3.2px 0 0;   /* the -3.2px cancels the trailing letter-space */
  opacity: 1;
  text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.7);
  pointer-events: none;
}

.zsi-badge {
  position: absolute;
  top: 0;
  right: -2px;
  min-width: 20px;
  height: 20px;
  background: #e03030;
  color: #fff;
  font: 700 var(--zt-sm)/20px var(--zf);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #16242c;
  box-shadow: 0 1px 5px rgba(0,0,0,.5);
  z-index: 3;
  pointer-events: none;
}

#zs-icon.zs-pulse { animation: zspulse 1.2s ease-out; }

@keyframes zspulse {
  0%   { filter: brightness(1); transform: scale(1); }
  25%  { filter: brightness(1.35) drop-shadow(0 0 16px var(--zd-accent)); transform: scale(1.12); }
  100% { filter: brightness(1); transform: scale(1); }
}

/* ==========================================================================
    3.  TOASTS
   ========================================================================== */

#zs-toasts {
  position: fixed;
  bottom: 164px;
  left: 20px;
  z-index: var(--zz-toast);
  font-family: var(--zf);
  font-size: var(--zt-base);
  line-height: var(--zt-lh);
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.zs-toast {
  pointer-events: auto;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  text-align: left;
  background: linear-gradient(135deg, #12232b, #0a1319);
  border: 1px solid var(--zp-line);
  border-left: 2px solid var(--zd-accent);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--zp-text);
  font-family: var(--zf);
  box-shadow: 0 6px 22px rgba(0,0,0,.55), 0 0 18px -8px var(--zd-accent);
  cursor: pointer;
  animation: zstIn .3s ease;
  max-width: 280px;
}

.zs-toast.zst-out { animation: zstOut .4s forwards; pointer-events: none; }

.zst-icon {
  color: var(--zd-accent);
  font-size: var(--zt-lg);
  margin-top: 2px;
  flex-shrink: 0;
}

.zst-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.zst-title { font: 600 var(--zt-md) var(--zf); color: var(--zd-gold); }
.zst-body { font: 400 var(--zt-base) var(--zf); color: var(--zp-dim); }

@keyframes zstIn {
  from { opacity: 0; transform: translateX(-20px); }
  to   { opacity: 1; transform: none; }
}

@keyframes zstOut {
  from { opacity: 1; }
  to   { opacity: 0; transform: translateX(-20px); }
}

/* ==========================================================================
    4.  THE PROJECTION  —  frame, unfurl, stage
   ========================================================================== */

#zs-ui {
  position: fixed;
  inset: 0;
  z-index: var(--zz-ui);
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, rgba(4,14,18,.55), rgba(0,0,0,.72));
  backdrop-filter: blur(4px);
  animation: zsfin .22s;

  /*
   * Size and leading are anchored here rather than inherited.
   *
   * The device is appended to Foundry's `body`, so anything it does not declare
   * comes from Foundry -- 15px/1.25 in v14. Every rule in this stylesheet that
   * omits a font size was therefore being set by the host application, and the
   * design's own 13px base step only applied where a rule happened to name it.
   * Declaring both on the root makes the type scale in section 1 the single
   * source of truth and makes the device render the same whatever the host
   * does with its own typography.
   */
  font-family: var(--zf);
  font-size: var(--zt-base);
  line-height: var(--zt-lh);
}

/* Fading, and therefore no longer anybody's click target — the backdrop is
   still full-screen for the length of the fade. */
#zs-ui.zs-out { animation: zsfout .3s forwards; pointer-events: none; }

@keyframes zsfin  { from { opacity: 0; } to { opacity: 1; } }
@keyframes zsfout { from { opacity: 1; } to { opacity: 0; } }

/* The haze at the bracelet's stone, where the light comes from */
.zsu-emitter {
  position: fixed;
  width: 200px;
  height: 200px;
  margin: -100px 0 0 -100px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--zd-accent) 0%, transparent 62%);
  opacity: 0;
  pointer-events: none;
  animation: zsemit 1.1s ease-out;
}

/*
 * Capped at .18. At .34 this 200px glow washed visibly over the panel whenever
 * the bracelet had been dragged anywhere near the middle of the screen. render()
 * also drops the element entirely when the stone is inside the frame's rect, so
 * this cap is the belt to that pair of braces.
 */
@keyframes zsemit {
  0%   { opacity: 0;   transform: scale(.2); }
  18%  { opacity: .18; transform: scale(.7); }
  100% { opacity: 0;   transform: scale(1.3); }
}

/*
 * The panel. Portrait, and made of light: the "frame" is a bloom plus a
 * hairline, with no metal anywhere. Height is capped against the viewport so a
 * laptop screen clamps rather than clipping.
 */
.zsu-frame {
  position: relative;
  width: var(--zs-panel-w);
  max-width: 94vw;
  height: var(--zs-panel-h);
  max-height: 92vh;
  animation: zsunfurl .55s cubic-bezier(.2,.86,.28,1);
  transform-origin: center;
}

#zs-ui.zs-out .zsu-frame { animation: zsfurl .26s forwards; }

/* Light unfurling from the stone: a sliver, then a column, then the panel. */
@keyframes zsunfurl {
  0% {
    opacity: 0;
    transform: translate(var(--zs-dx,0), var(--zs-dy,0)) scale(.10,.015);
    filter: blur(3px);
  }
  40% {
    opacity: .85;
    transform: translate(calc(var(--zs-dx,0px) * .34), calc(var(--zs-dy,0px) * .34)) scale(.52,.34);
    filter: blur(1px);
  }
  100% { opacity: 1; transform: none; filter: none; }
}

@keyframes zsfurl {
  from { opacity: 1; transform: none; }
  to   { opacity: 0; transform: translate(calc(var(--zs-dx,0px) * .5), calc(var(--zs-dy,0px) * .5)) scale(.3,.12); }
}

/* Outer bloom — the panel's only "frame" */
.zsu-bloom {
  position: absolute;
  inset: -26px;
  border-radius: 26px;
  background: radial-gradient(ellipse at center, var(--zd-accent) 0%, transparent 62%);
  opacity: .16;
  pointer-events: none;
  filter: blur(14px);
}

/* Hairline edge, with corner ticks drawn as gradient stops rather than art */
.zsu-edge {
  position: absolute;
  inset: 0;
  border-radius: 18px;
  border: 1px solid var(--zd-accent);
  opacity: .5;
  pointer-events: none;
  box-shadow:
    0 0 0 1px rgba(200,160,48,.14),
    inset 0 0 24px -6px var(--zd-accent),
    0 0 30px -6px var(--zd-accent);
}

.zsu-edge::before,
.zsu-edge::after {
  content: "";
  position: absolute;
  left: -1px;
  right: -1px;
  height: 16px;
  border-left: 2px solid var(--zd-gold);
  border-right: 2px solid var(--zd-gold);
  opacity: .55;
  pointer-events: none;
}

.zsu-edge::before { top: 10px; }
.zsu-edge::after  { bottom: 10px; }

/*
 * `container-type: size` is what lets the lock screen respond to the *panel*
 * rather than the viewport. The old `@media (max-height: ...)` blocks are keyed
 * to the window, so they missed exactly the case that broke: a panel clamped by
 * its own `max-height` inside a window that is still tall.
 */
.zsu-screen {
  position: absolute;
  inset: 0;
  container-type: size;
  container-name: zsscreen;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 18px;
  background:
    linear-gradient(175deg, var(--zp-panel-2), var(--zp-panel) 42%, var(--zp-ink));
  color: var(--zp-text);
}

/* Scanline texture — the screen is projected, and should read as it */
.zsu-grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  opacity: .5;
  background: repeating-linear-gradient(
    0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px);
  mix-blend-mode: screen;
}

/* One-shot boot sweep down the panel */
.zsu-sweep {
  position: absolute;
  left: 0;
  right: 0;
  height: 34%;
  top: -34%;
  pointer-events: none;
  z-index: 5;
  background: linear-gradient(180deg, transparent, var(--zd-accent) 60%, transparent);
  opacity: .16;
  animation: zssweep .85s ease-out .1s 1 both;
}

@keyframes zssweep {
  from { top: -34%; opacity: .22; }
  to   { top: 105%; opacity: 0; }
}

/*
 * Inside the panel, not outside it.
 *
 * At `top: -14px; right: -14px` this sat beyond `.zsu-frame` entirely, floating
 * on the outer bloom — and on a short viewport, where the frame is already
 * clamped against its vh cap, it could end up under the browser chrome with
 * nothing left to click. It now sits in the app bar's right end, which is where
 * a close control belongs and which the app bar reserves room for.
 */
.zsu-close {
  position: absolute;
  top: 9px;
  right: 10px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--zp-line);
  background: rgba(10,22,28,.86);
  color: var(--zp-dim);
  font: 300 var(--zt-2xl)/1 var(--zf);
  cursor: pointer;
  z-index: 9;
  transition: color .15s, border-color .15s, transform .15s;
}

.zsu-close:hover {
  color: var(--zd-accent);
  border-color: var(--zd-accent);
  transform: rotate(90deg);
}

/* --- stage: where views come and go --- */

.zsu-stage {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  z-index: 2;
}

.zsu-view {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.zsv-in-fwd   { animation: zsvInF .26s cubic-bezier(.2,.8,.3,1) both; }
.zsv-in-back  { animation: zsvInB .26s cubic-bezier(.2,.8,.3,1) both; }
.zsv-in-fade  { animation: zsvInX .18s ease both; }
.zsv-out-fwd  { animation: zsvOutF .24s ease forwards; }
.zsv-out-back { animation: zsvOutB .24s ease forwards; }
.zsv-out-fade { animation: zsvOutX .16s ease forwards; }

@keyframes zsvInF  { from { opacity: 0; transform: translateX(26px); }  to { opacity: 1; transform: none; } }
@keyframes zsvInB  { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
@keyframes zsvInX  { from { opacity: 0; } to { opacity: 1; } }
@keyframes zsvOutF { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-20px); } }
@keyframes zsvOutB { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(20px); } }
@keyframes zsvOutX { from { opacity: 1; } to { opacity: 0; } }

/* --- the scroll region inside a view --- */

.zsu-scroller {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 14px 16px 18px;
  scrollbar-width: thin;
  scrollbar-color: rgba(200,160,48,.3) transparent;
}

.zsu-scroller::-webkit-scrollbar { width: 6px; }
.zsu-scroller::-webkit-scrollbar-track { background: transparent; }
.zsu-scroller::-webkit-scrollbar-thumb {
  background: rgba(200,160,48,.28);
  border-radius: 3px;
}

/* ==========================================================================
    5.  FLOATING TOOLTIP
   ==========================================================================

   The status bar used to live here. It carried four things and three of them
   were duplicates or decoration: a small clock beside the lock screen's large
   one, a charge meter that was pure flavour, an aether meter that only ever
   said anything when there was no GM connected, and the notification bell.
   The bell became the Alerts app plus a badge in the home header; the aether
   meter became a strip that appears in Messages when the link is actually down;
   the other two are simply gone, which is the point of removing the bar.

   What is here instead is the tooltip layer. It is parented to <body> rather
   than to the element it describes, because every ancestor inside the device
   clips: `.zsu-scroller` on both axes, `.zsu-screen` on its rounded corners.
   Nothing positioned to escape a scroller can be relied on to escape it.
   ========================================================================== */

.zsu-tip {
  position: fixed;
  z-index: calc(var(--zz-ui) + 5);
  min-width: 140px;
  max-width: 210px;
  padding: 9px 12px;
  border-radius: 9px;
  border: 1px solid var(--zp-line);
  background: #0a1a21;
  box-shadow: 0 8px 24px rgba(0,0,0,.6);
  color: var(--zp-text);
  font-family: var(--zf);
  pointer-events: none;
  animation: zstipin .14s ease both;
}

@keyframes zstipin {
  from { opacity: 0; transform: translateY(3px); }
  to   { opacity: 1; transform: none; }
}

.zsu-tip-below { animation-name: zstipinb; }

@keyframes zstipinb {
  from { opacity: 0; transform: translateY(-3px); }
  to   { opacity: 1; transform: none; }
}

/* ==========================================================================
    6.  DOCK & APP BAR
   ========================================================================== */

/*
 * `space-around` with `flex: 1` children that also carry a `max-width` does not
 * distribute evenly: the children grow to their cap and the leftover space is
 * split unequally around them, so the row of five sat very slightly off centre.
 * Fixed-width children under `space-evenly` put equal air between and around
 * every one of them, which is what the eye is actually looking for.
 */
.zsu-dock {
  position: relative;
  z-index: 6;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid rgba(200,160,48,.12);
  background: linear-gradient(0deg, rgba(0,0,0,.34), transparent);
}

/*
 * `display: none` rather than `visibility: hidden`. Hidden, the dock still took
 * its ~56px of height on the lock screen, so the usable stage was 56px shorter
 * than the panel looked -- which is most of why the unlock button used to be
 * cut in half on a short panel.
 */
.zsu-dock.zsd-hidden { display: none; }

.zsd-btn {
  position: relative;
  flex: 0 0 auto;
  width: 62px;
  height: 42px;
  border: 0;
  border-radius: 10px;
  background: none;
  color: var(--zp-faint);
  font-size: 17px;
  cursor: pointer;
  transition: color .16s, background .16s, transform .16s;
}

.zsd-btn:hover { color: var(--zd-accent); background: rgba(255,255,255,.04); }

.zsd-btn.active {
  color: var(--zd-accent);
  background: rgba(255,255,255,.055);
  box-shadow: inset 0 0 0 1px rgba(200,160,48,.16);
}

.zsd-btn.active::after {
  content: "";
  position: absolute;
  bottom: 3px;
  left: 50%;
  transform: translateX(-50%);
  width: 14px;
  height: 2px;
  border-radius: 1px;
  background: var(--zd-accent);
  box-shadow: 0 0 6px var(--zd-accent);
}

.zsd-badge {
  position: absolute;
  top: 2px;
  right: 6px;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 9px;
  background: #e03030;
  color: #fff;
  font: 700 var(--zt-xs)/17px var(--zf);
}

/* --- app bar --- */

/*
 * A real three-column grid, and the two outer columns are equal `1fr`.
 *
 * That equality is what centres the title. The old flex version balanced a 30px
 * back button against a 30px spacer, so the title was centred only while the
 * trailing control happened to be exactly 30px wide -- and the Messages thread
 * header, which swaps the title for an avatar block and adds a mute button, was
 * visibly off. Here the side cells are sized by the grid rather than by their
 * contents, so the trailing cell can hold two controls and the close reserve
 * without moving the title a pixel.
 */
.zsu-appbar {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: 11px 12px 9px;
  border-bottom: 1px solid rgba(200,160,48,.1);
}

.zsu-appbar > .zsu-back { justify-self: start; }

.zsu-aptail {
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 6px;
}

.zsu-back,
.zsu-apbtn {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  border: 1px solid transparent;
  border-radius: 8px;
  background: none;
  color: var(--zp-dim);
  font-size: var(--zt-lg);
  cursor: pointer;
  transition: color .15s, background .15s, border-color .15s;
}

.zsu-back:hover,
.zsu-apbtn:hover {
  color: var(--zd-accent);
  background: rgba(255,255,255,.05);
  border-color: rgba(200,160,48,.18);
}

.zsu-apbtn.on { color: var(--zd-gold); }

.zsu-apptitle {
  min-width: 0;
  margin: 0;
  font: 600 var(--zt-lg) var(--zf);
  letter-spacing: .4px;
  color: var(--zp-text);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Keeps the trailing control out from under the floating close button. */
.zsu-apbspacer { width: 32px; flex-shrink: 0; }

/* ==========================================================================
    7.  LOCK SCREEN
   ========================================================================== */

/*
 * THE LOCK SCREEN CLIPPING BUG.
 *
 * `.zsl-open` uses `margin-top: auto` to push itself to the bottom. When the
 * content is taller than the space available that auto margin collapses to zero
 * and the button simply overflows the bottom of this wrap -- where the screen's
 * own `overflow: hidden` and rounded corner slice straight through it. At a
 * panel height of 520px the words TOUCH THE STONE were cut in half. Nothing
 * scrolled and nothing shrank; it was just gone.
 *
 * There was no overflow rule here at all. `overflow-y: auto` is the floor under
 * everything else: whatever happens to the spacing above, the unlock affordance
 * is now reachable rather than clipped. The two other halves of the fix are the
 * dock collapsing to `display: none` on lock (recovering the ~56px it used to
 * hold while merely invisible) and the container queries at the bottom of this
 * section, which shrink the fixed spacing against the *panel* rather than the
 * window.
 */
.zsl-wrap {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
  padding: 44px 26px 24px;
  text-align: center;
  scrollbar-width: thin;
  scrollbar-color: rgba(200,160,48,.3) transparent;
}

.zsl-wrap::-webkit-scrollbar { width: 6px; }
.zsl-wrap::-webkit-scrollbar-thumb { background: rgba(200,160,48,.28); border-radius: 3px; }

.zsl-device {
  font: 500 var(--zt-sm) var(--zm);
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--zd-gold-dark);
  margin: 0 -3px 14px 0;   /* the -3px cancels the trailing letter-space */
}

.zsl-clock {
  flex-shrink: 0;
  font: 200 var(--zt-display)/1.2 var(--zf);
  letter-spacing: -1px;
  color: #eaf6f7;
  text-shadow: 0 0 26px var(--zd-accent);
}

.zsl-date {
  font: 400 var(--zt-md) var(--zf);
  letter-spacing: 1.6px;
  color: var(--zp-dim);
  margin: 6px -1.6px 0 0;
}

.zsl-rule {
  width: 54px;
  height: 1px;
  margin: 22px 0 4px;
  background: linear-gradient(90deg, transparent, var(--zd-gold), transparent);
  opacity: .6;
}

.zsl-event {
  margin-top: 16px;
  padding: 12px 22px;
  border: 1px solid rgba(200,160,48,.18);
  border-radius: 12px;
  background: rgba(255,255,255,.025);
}

.zsl-evlabel {
  font: 600 var(--zt-2xs) var(--zm);
  letter-spacing: 2.4px;
  margin-right: -2.4px;
  color: var(--zd-gold-dark);
}

.zsl-evname {
  font: 500 var(--zt-xl) var(--zf);
  color: var(--zp-text);
  margin: 4px 0 2px;
}

.zsl-evdays {
  font: 600 var(--zt-base) var(--zm);
  letter-spacing: 1.6px;
  margin-right: -1.6px;
  color: var(--zd-accent);
}

.zsl-pills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
}

.zsl-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.07);
  background: rgba(255,255,255,.04);
  font: 500 var(--zt-base) var(--zf);
  color: var(--zp-dim);
}

.zsl-pill i { color: var(--zd-accent); font-size: var(--zt-sm); }

/* The unlock affordance — a stone to touch, not a button to press */
.zsl-open {
  position: relative;
  flex-shrink: 0;
  margin-top: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 18px 24px 4px;
  border: 0;
  background: none;
  cursor: pointer;
  color: inherit;
}

.zsl-openglow {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 34%, var(--zd-accent-bright), var(--zd-accent) 52%, var(--zd-accent-deep));
  box-shadow: 0 0 22px -2px var(--zd-accent);
  animation: zsl-pulse 2.6s ease-in-out infinite;
}

@keyframes zsl-pulse {
  0%, 100% { box-shadow: 0 0 18px -4px var(--zd-accent); transform: scale(1); }
  50%      { box-shadow: 0 0 34px -2px var(--zd-accent); transform: scale(1.06); }
}

.zsl-opentext {
  font: 500 var(--zt-sm) var(--zm);
  letter-spacing: 2.4px;
  margin-right: -2.4px;
  text-transform: uppercase;
  color: var(--zp-faint);
  transition: color .2s;
}

.zsl-open:hover .zsl-opentext { color: var(--zd-accent); }
.zsl-open:hover .zsl-openglow { box-shadow: 0 0 34px 0 var(--zd-accent); }

/* ==========================================================================
    8.  HOME  —  app grid
   ========================================================================== */

/*
 * `padding-right` clears the floating close button; the bell sits inside that
 * reserve, immediately left of it.
 */
.zsn-head {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 50px 10px 18px;
}

.zsn-who { flex: 1; }

/*
 * The notification bell that used to live in the status bar.
 *
 * Alerts is a full app in the grid now, but a badge you have to go hunting for
 * among ten tiles is not a notification. This is the one place it needs to be
 * visible the moment the device unlocks.
 */
.zsn-bell {
  position: relative;
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: none;
  color: var(--zp-dim);
  font-size: var(--zt-lg);
  cursor: pointer;
  transition: color .15s, background .15s, border-color .15s;
}

.zsn-bell:hover {
  color: var(--zd-accent);
  background: rgba(255,255,255,.05);
  border-color: rgba(200,160,48,.18);
}

.zsn-bell.has { color: var(--zd-gold); }

.zsn-belldot {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #e03030;
  box-shadow: 0 0 5px #e03030;
}

.zsn-pic {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid var(--zd-accent);
  box-shadow: 0 0 14px -4px var(--zd-accent);
}

.zsn-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }

.zsn-who { min-width: 0; }

.zsn-name {
  font: 600 var(--zt-xl) var(--zf);
  color: #eaf6f7;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.zsn-sub {
  font: 400 var(--zt-base) var(--zf);
  letter-spacing: 1.2px;
  color: var(--zd-gold-dark);
  text-transform: uppercase;
}

.zsn-status {
  flex-shrink: 0;
  margin: 0 18px 6px;
  padding: 8px 12px;
  border-left: 2px solid var(--zd-accent);
  border-radius: 0 8px 8px 0;
  background: rgba(255,255,255,.03);
  font: 400 var(--zt-md) var(--zf);
  font-style: italic;
  color: var(--zp-dim);
}

.zsn-status i { color: var(--zd-accent); font-size: var(--zt-xs); margin-right: 5px; opacity: .7; }

/*
 * The column gap was 6px while the badge overhangs its tile by 5px on the right,
 * so a badge landed a pixel from the neighbouring tile. 14px gives the overhang
 * room, and the tiles have grown with the panel besides.
 */
.zsn-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px 14px;
  padding-top: 10px;
}

.zsn-app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 6px 2px;
  border: 0;
  background: none;
  cursor: pointer;
  color: inherit;
  border-radius: 12px;
  transition: transform .16s cubic-bezier(.34,1.4,.64,1);
}

.zsn-app:hover { transform: translateY(-3px); }
.zsn-app:active { transform: translateY(-1px) scale(.97); }

.zsn-tile {
  position: relative;
  width: 62px;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 17px;
  font-size: 24px;
  color: var(--zd-accent);
  background: linear-gradient(150deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
  border: 1px solid rgba(200,160,48,.16);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 3px 10px rgba(0,0,0,.35);
  transition: box-shadow .18s, border-color .18s;
}

.zsn-app:hover .zsn-tile {
  border-color: var(--zd-accent);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 0 18px -4px var(--zd-accent);
}

/* Inset, so the overhang stays inside the grid gap and the scroller's padding. */
.zsn-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 10px;
  background: #e03030;
  color: #fff;
  font: 700 var(--zt-sm)/1 var(--zf);
  border: 2px solid var(--zp-panel);
}

.zsn-label {
  font: 500 var(--zt-sm) var(--zf);
  letter-spacing: .3px;
  color: var(--zp-dim);
  text-align: center;
  line-height: 1.2;
}

/* ==========================================================================
    9.  SHARED CONTENT BITS
   ========================================================================== */

.zs-empty {
  padding: 40px 20px;
  text-align: center;
  font: 400 var(--zt-md) var(--zf);
  color: var(--zp-faint);
  font-style: italic;
}

/* ==========================================================================
    10.  STUDENT ID
   ========================================================================== */

.zsh-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid rgba(200,160,48,.2);
  background: linear-gradient(140deg, rgba(255,255,255,.07), rgba(255,255,255,.015));
  overflow: hidden;
}

.zsh-cardglow {
  position: absolute;
  top: -60%;
  right: -30%;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--zd-accent), transparent 66%);
  opacity: .12;
  pointer-events: none;
}

.zsh-portrait {
  width: 74px;
  height: 74px;
  flex-shrink: 0;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--zd-accent);
  box-shadow: 0 0 16px -5px var(--zd-accent);
}

.zsh-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }

.zsh-info { min-width: 0; position: relative; }

.zsh-name { font: 600 var(--zt-xl) var(--zf); color: #eaf6f7; line-height: 1.2; }

.zsh-cohort {
  font: 500 var(--zt-sm) var(--zm);
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--zd-gold);
  margin-top: 3px;
}

.zsh-id {
  font: 400 var(--zt-base) var(--zm);
  letter-spacing: 1.4px;
  color: var(--zp-faint);
  margin-top: 5px;
}

/* --- status line --- */

.zsh-status { margin: 12px 0; }

.zsh-statbtn {
  width: 100%;
  text-align: left;
  padding: 9px 12px;
  border: 1px dashed rgba(200,160,48,.2);
  border-radius: 9px;
  background: rgba(255,255,255,.02);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}

.zsh-statbtn:hover { border-color: var(--zd-accent); background: rgba(255,255,255,.045); }

.zsh-stxt { font: 400 var(--zt-md) var(--zf); font-style: italic; color: var(--zp-text); }
.zsh-stph { color: var(--zp-faint); }

.zsh-statinput {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--zd-accent);
  border-radius: 9px;
  background: rgba(0,0,0,.3);
  color: var(--zp-text);
  font: 400 var(--zt-md) var(--zf);
}

/* --- stats --- */

.zsh-stats { display: flex; gap: 8px; margin-bottom: 12px; }

.zsh-stat {
  flex: 1;
  min-width: 0;
  padding: 10px 8px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.06);
  background: rgba(255,255,255,.03);
  text-align: center;
}

.zsh-sl {
  font: 600 var(--zt-2xs) var(--zm);
  letter-spacing: 1.6px;
  margin-right: -1.6px;
  color: var(--zp-faint);
}

.zsh-sv {
  font: 500 var(--zt-lg) var(--zf);
  color: var(--zp-text);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.zsh-sv.zsh-gold { color: var(--zd-gold-light); font-weight: 600; }
.zsh-sv.zsh-sm { font-size: var(--zt-base); }

/* --- event --- */

.zsh-event {
  padding: 12px 14px;
  margin-bottom: 12px;
  border-radius: 11px;
  border: 1px solid rgba(200,160,48,.2);
  background: linear-gradient(100deg, rgba(200,160,48,.08), transparent);
}

.zsh-evlabel { font: 600 var(--zt-2xs) var(--zm); letter-spacing: 2px; color: var(--zd-gold-dark); }
.zsh-evname { font: 500 var(--zt-lg) var(--zf); color: var(--zp-text); margin: 4px 0 3px; }
.zsh-evdays { font: 600 var(--zt-base) var(--zm); letter-spacing: 1.4px; color: var(--zd-accent); }

.zsh-detail {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 12px;
  margin-bottom: 10px;
  border-radius: 9px;
  background: rgba(255,255,255,.025);
  font: 400 var(--zt-md) var(--zf);
  color: var(--zp-text);
}

.zsh-dl { font: 600 var(--zt-2xs) var(--zm); letter-spacing: 1.6px; color: var(--zp-faint); align-self: center; }

.zsh-notes {
  padding: 12px 14px;
  border-radius: 10px;
  border-left: 2px solid var(--zd-gold);
  background: rgba(255,255,255,.025);
  font: 400 var(--zt-md)/1.6 var(--zf);
  color: var(--zp-dim);
}

.zsh-notes p:first-child { margin-top: 0; }
.zsh-notes p:last-child { margin-bottom: 0; }

/* ==========================================================================
    11.  SCHEDULE
   ========================================================================== */

.zss-row {
  display: flex;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,.05);
}

.zss-row:last-child { border-bottom: 0; }

.zss-period {
  width: 82px;
  flex-shrink: 0;
  font: 600 var(--zt-xs) var(--zm);
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--zd-gold-dark);
  padding-top: 3px;
}

.zss-info { min-width: 0; }
.zss-course { font: 500 var(--zt-lg) var(--zf); color: var(--zp-text); }
.zss-meta { font: 400 var(--zt-base) var(--zf); color: var(--zp-faint); margin-top: 3px; }

/* ==========================================================================
    12.  GIFT
   ========================================================================== */

.zsg-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 12px;
  margin-bottom: 12px;
  border-bottom: 1px solid rgba(200,160,48,.16);
}

.zsg-name {
  font: 600 var(--zt-2xl) var(--zf);
  color: #eaf6f7;
  text-shadow: 0 0 18px var(--zd-accent);
}

.zsg-lvl {
  flex-shrink: 0;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid var(--zd-gold);
  font: 600 var(--zt-base) var(--zm);
  color: var(--zd-gold-light);
}

.zsg-desc {
  font: 400 var(--zt-md)/1.65 var(--zf);
  color: var(--zp-dim);
  margin-bottom: 16px;
}

.zsg-mslabel {
  font: 600 var(--zt-2xs) var(--zm);
  letter-spacing: 2.2px;
  color: var(--zp-faint);
  margin-bottom: 8px;
}

.zsg-track {
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,.07);
  overflow: hidden;
  margin-bottom: 6px;
}

.zsg-fill {
  display: block;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--zd-accent-deep), var(--zd-accent));
  box-shadow: 0 0 10px -2px var(--zd-accent);
  transition: width .5s cubic-bezier(.2,.8,.3,1);
}

.zsg-count {
  font: 400 var(--zt-sm) var(--zm);
  letter-spacing: 1px;
  color: var(--zp-faint);
  margin-bottom: 14px;
}

.zsg-ms {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  font: 400 var(--zt-md) var(--zf);
  color: var(--zp-faint);
  border-bottom: 1px solid rgba(255,255,255,.04);
}

.zsg-ms:last-child { border-bottom: 0; }
.zsg-ms.done { color: var(--zp-text); }
.zsg-dot { color: var(--zp-faint); font-size: var(--zt-base); }
.zsg-ms.done .zsg-dot { color: var(--zd-gold); text-shadow: 0 0 8px var(--zd-gold); }

/* --------------------------------------------------------------------------
   The tree
   --------------------------------------------------------------------------

   The board fills whatever the panel has left under the header, because a tree
   is a shape and a letterboxed strip of one is not a shape you can read. It is
   a pan-and-zoom surface rather than a scroller: `.zsu-scroller` would fight
   the drag, so the tree does not use one.
*/

.zsg-thead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  /* The view has no padding of its own — the scroller usually supplies it, and
     the tree deliberately does not use one. */
  padding: 2px 16px 10px;
  border-bottom: 1px solid rgba(200,160,48,.16);
}

.zsg-tname {
  font: 600 var(--zt-lg) var(--zf);
  color: #eaf6f7;
  text-shadow: 0 0 14px var(--zd-accent);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.zsg-pts {
  flex-shrink: 0;
  display: flex;
  align-items: baseline;
  gap: 5px;
  color: var(--zp-faint);
}

/* Points only earn the accent when there are some. A bright zero is a lie. */
.zsg-pts.has { color: var(--zd-accent-bright); }

.zsg-ptn { font: 700 var(--zt-lg) var(--zm); }
.zsg-ptl { font: 400 var(--zt-xs) var(--zf); }

.zsg-boardwrap {
  position: relative;
  flex: 1;
  min-height: 0;
  margin: 10px 12px 12px;
}

.zsg-board {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border: 1px solid rgba(200,160,48,.14);
  border-radius: 12px;
  background:
    radial-gradient(circle at 50% 40%, rgba(80,216,232,.06), transparent 60%),
    #02080c;
  cursor: grab;
  touch-action: none;
}

.zsg-board.dragging { cursor: grabbing; }

/*
 * The coordinate space. Inset for the same reason the editor's is: a node is
 * centred on its own percentage and is wider than it is tall, so 0% and 100%
 * would put half of it outside a pane that has to clip.
 */
.zsg-plane {
  position: absolute;
  inset: 26px 54px;
  transform-origin: 50% 50%;
  will-change: transform;
}

.zsg-edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.zsg-edge {
  stroke: rgba(125,147,154,.35);
  stroke-width: 1.5;
  vector-effect: non-scaling-stroke;
}

/* Both ends taken: a finished path should read as a path, not as a diagram. */
.zsg-edge.lit {
  stroke: var(--zd-accent);
  stroke-width: 2;
  filter: drop-shadow(0 0 4px var(--zd-accent-deep));
}

.zsg-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  width: auto;
  height: auto;
  min-width: 62px;
  max-width: 104px;
  padding: 6px 8px;
  border: 1px solid rgba(200,160,48,.2);
  border-radius: 9px;
  background: linear-gradient(180deg, var(--zp-panel-2), var(--zp-panel));
  color: var(--zp-dim);
  font: 500 var(--zt-xs)/1.25 var(--zf);
  text-align: center;
  cursor: pointer;
}

.zsg-nlabel { word-break: break-word; }

.zsg-ncost {
  font: 700 var(--zt-xs) var(--zm);
  color: var(--zd-gold);
}

.zsg-ntick { font-size: 9px; color: var(--zd-accent-bright); }

/*
 * The four states.
 *
 * "Locked by cost" and "locked by requirement" are drawn apart on purpose: *you
 * cannot afford this yet* and *you have not earned the right to this* are
 * different messages, and a tree that greys both out the same way reads as
 * arbitrary.
 */
.zsg-node.s-taken {
  border-color: var(--zd-accent);
  color: #eaf6f7;
  box-shadow: 0 0 12px rgba(80,216,232,.3), inset 0 0 14px rgba(80,216,232,.08);
}

.zsg-node.s-affordable {
  border-color: var(--zd-gold);
  color: var(--zp-text);
  box-shadow: 0 0 14px rgba(224,192,80,.28);
  animation: zsg-beckon 2.6s ease-in-out infinite;
}

.zsg-node.s-locked-cost { opacity: .78; }
.zsg-node.s-locked-cost .zsg-ncost { color: #e8a06a; }

.zsg-node.s-locked-req {
  opacity: .42;
  border-style: dashed;
}

.zsg-node.open { outline: 2px solid var(--zd-accent-bright); outline-offset: 2px; }

@keyframes zsg-beckon {
  0%, 100% { box-shadow: 0 0 14px rgba(224,192,80,.28); }
  50%      { box-shadow: 0 0 20px rgba(224,192,80,.5); }
}

.zsg-node.k-capstone { border-radius: 14px; }
.zsg-node.k-milestone { border-left: 3px solid var(--zd-gold); }
.zsg-node.k-freeform { border-left: 3px solid #b48ce8; }

.zsg-zoom {
  position: absolute;
  right: 9px;
  bottom: 9px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.zsg-zbtn {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid rgba(200,160,48,.25);
  border-radius: 8px;
  background: rgba(2,8,12,.86);
  color: var(--zp-dim);
  font-size: 12px;
  cursor: pointer;
}

.zsg-zbtn:hover { color: var(--zd-accent-bright); border-color: var(--zd-accent); }

.zsg-recentre {
  width: auto;
  height: auto;
  padding: 4px 8px;
  border: 0;
  background: none;
  color: var(--zp-dim);
  font-size: 13px;
  cursor: pointer;
}

.zsg-recentre:hover { color: var(--zd-accent-bright); }

/* --- the node sheet, over the board --- */

.zsg-sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 4;
  max-height: 62%;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--zd-accent-deep);
  border-radius: 14px 14px 0 0;
  background: linear-gradient(180deg, rgba(12,31,40,.98), rgba(4,13,18,.99));
  box-shadow: 0 -10px 30px rgba(0,0,0,.6);
  animation: zsg-rise .18s ease-out;
}

@keyframes zsg-rise {
  from { transform: translateY(14px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

.zsg-shead {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 12px 8px;
}

.zsg-skind {
  flex-shrink: 0;
  padding: 2px 8px;
  border: 1px solid rgba(200,160,48,.3);
  border-radius: 20px;
  font: 600 var(--zt-xs) var(--zf);
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--zd-gold);
}

.zsg-sname {
  flex: 1;
  min-width: 0;
  font: 600 var(--zt-lg) var(--zf);
  color: #eaf6f7;
}

.zsg-sclose {
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.05);
  color: var(--zp-dim);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
}

.zsg-sbody {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 0 12px 10px;
}

.zsg-sdesc {
  font: 400 var(--zt-base)/1.55 var(--zf);
  color: var(--zp-text);
  margin-bottom: 10px;
}

.zsg-slabel {
  font: 700 var(--zt-xs) var(--zf);
  letter-spacing: 1.2px;
  color: var(--zp-faint);
  margin: 10px 0 4px;
}

.zsg-seffect {
  font: 400 var(--zt-sm)/1.5 var(--zm);
  color: var(--zd-accent-bright);
}

.zsg-sneeds { font: 400 var(--zt-sm)/1.5 var(--zf); color: #e8a06a; }

.zsg-sgrant {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 4px;
  font: 400 var(--zt-sm) var(--zf);
  color: var(--zp-text);
}

.zsg-gimg { width: 20px; height: 20px; border-radius: 4px; flex: none; }

.zsg-sfoot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-top: 1px solid rgba(255,255,255,.06);
}

.zsg-scost {
  flex: 1;
  font: 600 var(--zt-base) var(--zf);
  color: var(--zd-gold);
}

.zsg-stag {
  flex: 1;
  font: 500 var(--zt-base) var(--zf);
  color: var(--zd-accent-bright);
}

.zsg-stag.locked { color: var(--zp-faint); }

.zsg-take {
  width: auto;
  height: auto;
  flex-shrink: 0;
  padding: 9px 16px;
  border: 1px solid var(--zd-gold);
  border-radius: 9px;
  background: rgba(224,192,80,.12);
  color: #f3e4b0;
  font: 600 var(--zt-base) var(--zf);
  cursor: pointer;
}

.zsg-take:hover { background: rgba(224,192,80,.24); color: #fff6d8; }

/* ==========================================================================
    13.  NOTICES  (the school board)
   ========================================================================== */

.zsb-notice {
  position: relative;
  padding: 12px 34px 12px 14px;
  margin-bottom: 10px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.06);
  border-left: 2px solid var(--zd-gold-dark);
  background: rgba(255,255,255,.028);
}

.zsb-notice.pinned {
  border-left-color: var(--zd-accent);
  background: linear-gradient(100deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
}

.zsb-nhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.zsb-nhead i { color: var(--zd-gold); font-size: var(--zt-sm); }
.zsb-notice.pinned .zsb-nhead i { color: var(--zd-accent); }

.zsb-ntime { font: 400 var(--zt-xs) var(--zm); letter-spacing: 1px; color: var(--zp-faint); }

.zsb-nbody { font: 400 var(--zt-md)/1.55 var(--zf); color: var(--zp-text); }

.zsb-ndismiss {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 20px;
  height: 20px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--zp-faint);
  font-size: 10px;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s, color .15s, background .15s;
}

.zsb-notice:hover .zsb-ndismiss,
.zsb-ndismiss:focus-visible { opacity: 1; }
.zsb-ndismiss:hover { color: #e06060; background: rgba(255,255,255,.06); }

/* ==========================================================================
    14.  MESSAGES
   ========================================================================== */

.zsm-thread {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 8px;
  border: 0;
  border-radius: 11px;
  background: none;
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: background .15s;
}

.zsm-thread:hover { background: rgba(255,255,255,.045); }
.zsm-thread.unread { background: rgba(255,255,255,.03); }

.zsm-tavatar,
.zsm-tavatar-ph {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid rgba(200,160,48,.24);
}

.zsm-tavatar-ph {
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.05);
  color: var(--zp-faint);
  font-size: 15px;
}

.zsm-thread.unread .zsm-tavatar,
.zsm-thread.unread .zsm-tavatar-ph {
  border-color: var(--zd-accent);
  box-shadow: 0 0 12px -3px var(--zd-accent);
}

.zsm-tinfo { flex: 1; min-width: 0; }

.zsm-tname {
  font: 500 var(--zt-lg) var(--zf);
  color: var(--zp-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.zsm-thread.unread .zsm-tname { font-weight: 600; color: #eaf6f7; }
.zsm-tmute { color: var(--zp-faint); font-size: var(--zt-xs); margin-left: 4px; }

.zsm-tpreview {
  font: 400 var(--zt-base) var(--zf);
  color: var(--zp-faint);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.zsm-tmeta {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
}

.zsm-ttime { font: 400 var(--zt-xs) var(--zm); color: var(--zp-faint); }

.zsm-tunread {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--zd-accent);
  color: #04161a;
  font: 700 var(--zt-sm)/18px var(--zf);
  text-align: center;
}

/* --- thread header --- */

.zsm-thead { flex: 1; display: flex; align-items: center; gap: 9px; min-width: 0; }

.zsm-thimg {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--zd-accent);
  flex-shrink: 0;
}

.zsm-thtext { min-width: 0; }

.zsm-thname {
  font: 600 var(--zt-lg) var(--zf);
  color: var(--zp-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.zsm-thsub { font: 400 var(--zt-xs) var(--zm); letter-spacing: .8px; color: var(--zp-faint); }

/* --- message list --- */

.zsm-msglist {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scrollbar-width: thin;
  scrollbar-color: rgba(200,160,48,.3) transparent;
}

.zsm-msglist > :first-child { margin-top: auto; }

.zsm-msglist::-webkit-scrollbar { width: 6px; }
.zsm-msglist::-webkit-scrollbar-thumb { background: rgba(200,160,48,.28); border-radius: 3px; }

.zsm-daysep {
  align-self: center;
  margin: 12px -1.4px 8px 0;
  padding: 3px 12px;
  border-radius: 20px;
  background: rgba(255,255,255,.05);
  font: 500 var(--zt-xs) var(--zm);
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--zp-faint);
}

.zsm-msg {
  max-width: 80%;
  align-self: flex-start;
  padding: 8px 12px 6px;
  border-radius: 14px 14px 14px 4px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.05);
  animation: zsmsg .22s ease both;
}

.zsm-msg.zsm-sent {
  align-self: flex-end;
  border-radius: 14px 14px 4px 14px;
  background: linear-gradient(140deg, var(--zd-accent-deep),
              color-mix(in srgb, var(--zd-accent-deep) 55%, transparent));
  border-color: rgba(255,255,255,.08);
}

@keyframes zsmsg {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: none; }
}

.zsm-mfrom {
  font: 600 var(--zt-xs) var(--zm);
  letter-spacing: .8px;
  color: var(--zd-gold);
  margin-bottom: 3px;
}

.zsm-mbody {
  font: 400 var(--zt-md)/1.5 var(--zf);
  color: var(--zp-text);
  word-wrap: break-word;
  overflow-wrap: anywhere;
}

.zsm-mimg {
  display: block;
  max-width: 100%;
  border-radius: 8px;
  margin-top: 6px;
  cursor: pointer;
}

.zsm-mtime {
  font: 400 var(--zt-xs) var(--zm);
  color: var(--zp-faint);
  text-align: right;
  margin-top: 3px;
  opacity: .75;
}

/* On a sent bubble the fill is a saturated accent, so the grey vanishes. */
.zsm-sent .zsm-mtime { color: #eaf6f7; opacity: .6; }

/* --- composer --- */

.zsm-reply {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: 10px 14px;
  border-top: 1px solid rgba(200,160,48,.1);
}

.zsm-replyinput {
  flex: 1;
  min-width: 0;
  padding: 9px 14px;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 20px;
  background: rgba(0,0,0,.28);
  color: var(--zp-text);
  font: 400 var(--zt-md) var(--zf);
  transition: border-color .15s;
}

.zsm-replyinput::placeholder { color: var(--zp-faint); }
.zsm-replyinput:focus { border-color: var(--zd-accent); outline: none; }

.zsm-sendbtn {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  background: var(--zd-accent);
  color: #04161a;
  font-size: 13px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}

.zsm-sendbtn:hover { transform: scale(1.08); box-shadow: 0 0 14px -2px var(--zd-accent); }

/*
 * The aether warning.
 *
 * This is what is left of the status bar's signal meter, and it is better for
 * being smaller: the meter said something on every screen at all times, and the
 * only state worth reading was "no GM connected, so a message to another
 * student will not arrive". Shown here, on the screen where that matters, and
 * only when it is true.
 */
.zsm-aether {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 12px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid rgba(208,128,64,.32);
  background: rgba(208,128,64,.08);
  font: 400 var(--zt-base)/1.4 var(--zf);
  color: #e0b090;
}

.zsm-aether i { flex-shrink: 0; color: #d08040; font-size: var(--zt-md); }

/* --- new conversation picker --- */

.zsm-picker {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 56px;
  z-index: 7;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid var(--zp-line);
  background: #0b1a21;
  box-shadow: 0 12px 34px rgba(0,0,0,.6);
  animation: zsvInX .16s ease both;
}

.zsm-picker-title {
  font: 600 var(--zt-xs) var(--zm);
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--zp-faint);
  padding: 4px 6px 8px;
}

.zsm-picker-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 7px 8px;
  border: 0;
  border-radius: 9px;
  background: none;
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: background .14s;
}

.zsm-picker-row:hover { background: rgba(255,255,255,.06); }

.zsm-picker-img {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid rgba(200,160,48,.24);
}

.zsm-picker-name { font: 500 var(--zt-md) var(--zf); color: var(--zp-text); }

/* --- attachments --- */

/*
 * The image queued on the composer.
 *
 * Above the reply row rather than inside it: the row is a fixed-height strip
 * tuned around a 36px send button, and a thumbnail in it either squashes the
 * input or pushes the whole strip taller than the thread it sits under.
 */
.zsm-attach {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 14px;
  padding: 7px 9px;
  border: 1px solid var(--zd-accent);
  border-radius: 10px;
  background: color-mix(in srgb, var(--zd-accent) 8%, transparent);
}

.zsm-attach-img {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 6px;
  object-fit: cover;
}

.zsm-attach-cap {
  flex: 1;
  min-width: 0;
  font: 400 var(--zt-sm) var(--zf);
  color: var(--zp-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.zsm-attach-x {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  color: var(--zp-faint);
  cursor: pointer;
  transition: color .15s, background .15s;
}

.zsm-attach-x:hover { color: #e08080; background: rgba(224,96,96,.12); }

.zsm-clipbtn {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 50%;
  background: rgba(0,0,0,.28);
  color: var(--zp-dim);
  font-size: 13px;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}

.zsm-clipbtn:hover { color: var(--zd-accent); border-color: var(--zd-accent); }

/* The gallery picker reuses the conversation picker's shell and its own grid. */
.zsm-gpicker { max-height: 60%; overflow-y: auto; }
.zsm-gpicker .zsx-grid { margin-bottom: 8px; }

.zsm-picker-row.on {
  background: color-mix(in srgb, var(--zd-accent) 14%, transparent);
  box-shadow: inset 0 0 0 1px var(--zd-accent);
}

.zsm-picker-tick { margin-left: auto; color: var(--zd-accent); opacity: 0; transition: opacity .14s; }
.zsm-picker-row.on .zsm-picker-tick { opacity: 1; }


.zsm-picker-cancel {
  width: 100%;
  margin-top: 6px;
  padding: 7px;
  border: 0;
  border-top: 1px solid rgba(255,255,255,.06);
  background: none;
  color: var(--zp-faint);
  font: 500 var(--zt-base) var(--zf);
  cursor: pointer;
}

.zsm-picker-cancel:hover { color: var(--zp-text); }

/* ==========================================================================
    15.  CONTACTS  (visual-novel panel)
   ========================================================================== */

.zsr-vn-cat {
  font: 600 var(--zt-2xs) var(--zm);
  letter-spacing: 2.4px;
  text-transform: uppercase;
  color: var(--zd-gold-dark);
  margin: 14px 0 10px;
  padding-bottom: 5px;
  border-bottom: 1px solid rgba(200,160,48,.14);
}

.zsr-vn-cat:first-child { margin-top: 0; }

.zsr-vn-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px 10px;
  margin-bottom: 6px;
}

.zsr-vn-circle {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  cursor: pointer;
  transition: transform .18s cubic-bezier(.34,1.4,.64,1);
}

.zsr-vn-circle:hover { transform: translateY(-3px); }

.zsr-vn-img,
.zsr-vn-ph {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--rel-color, #808080);
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 14px -4px var(--rel-glow, transparent);
  transition: box-shadow .18s;
}

.zsr-vn-ph {
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.05);
  color: var(--zp-faint);
  font-size: 21px;
}

.zsr-vn-circle:hover .zsr-vn-img,
.zsr-vn-circle:hover .zsr-vn-ph {
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 20px -2px var(--rel-glow, transparent);
}

.zsr-vn-cname {
  font: 500 var(--zt-sm) var(--zf);
  color: var(--zp-dim);
  text-align: center;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.zsr-vn-online {
  position: absolute;
  top: 46px;
  right: 2px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #40d080;
  border: 2px solid var(--zp-panel);
  box-shadow: 0 0 8px #40d080;
}

/* --- hover tooltip --- */

/*
 * The tooltip box itself is `.zsu-tip` in section 5, parented to <body>.
 *
 * It used to be a child of the circle at `bottom: calc(100% + 8px)`, escaping
 * upward -- straight into `.zsu-scroller`, which is `overflow-y: auto;
 * overflow-x: hidden` and therefore clips on both axes. The top row of every
 * category lost its tooltip to the top edge and the outer columns lost theirs
 * sideways. Only the rank/title/status typography lives here now.
 */
.zsu-tip .zsr-vn-tip-name { font: 600 var(--zt-md) var(--zf); color: var(--zp-text); }
.zsu-tip .zsr-vn-tip-title { font: 400 var(--zt-sm) var(--zf); color: var(--zp-faint); margin-top: 2px; }
.zsu-tip .zsr-vn-tip-rank { font: 600 var(--zt-sm) var(--zm); letter-spacing: 1px; margin-top: 5px; }

.zsu-tip .zsr-vn-tip-status {
  font: 400 var(--zt-sm) var(--zf);
  font-style: italic;
  color: var(--zp-dim);
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid rgba(255,255,255,.07);
}

.zsu-tip .zsr-vn-tip-status i { font-size: var(--zt-2xs); color: var(--zd-accent); margin-right: 4px; }

/* --- detail panel --- */

.zsr-vn-card {
  display: flex;
  gap: 14px;
  margin-bottom: 16px;
}

.zsr-vn-portrait { flex-shrink: 0; }

.zsr-vn-pbtn {
  padding: 0;
  border: 0;
  background: none;
  cursor: zoom-in;
  display: block;
}

.zsr-vn-portrait img,
.zsr-vn-portrait-ph {
  width: 96px;
  height: 118px;
  border-radius: 10px;
  object-fit: cover;
  display: block;
  border: 1px solid var(--rel-color, #808080);
  box-shadow: 0 4px 18px rgba(0,0,0,.5);
}

.zsr-vn-portrait-ph {
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.05);
  color: var(--zp-faint);
  font-size: 28px;
}

.zsr-vn-dinfo { flex: 1; min-width: 0; }

.zsr-vn-dname { font: 600 var(--zt-xl) var(--zf); color: #eaf6f7; }

.zsr-vn-dtitle {
  font: 400 var(--zt-base) var(--zf);
  letter-spacing: .8px;
  color: var(--zd-gold-dark);
  margin-top: 2px;
}

.zsr-vn-dbar-wrap { margin-top: 12px; }

.zsr-vn-dbar {
  position: relative;
  height: 5px;
  border-radius: 3px;
  background: linear-gradient(90deg,
    #a02020, #c03030, #d05040, #b07060, #908070,
    #808080, #6a8870, #509050, #40a060, #c0a030, #d4940a);
}

.zsr-vn-dmarker {
  position: absolute;
  top: 50%;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #fff;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 8px rgba(255,255,255,.8), 0 1px 4px rgba(0,0,0,.6);
  transition: left .45s cubic-bezier(.34,1.4,.64,1);
}

.zsr-vn-drank {
  font: 600 var(--zt-base) var(--zm);
  letter-spacing: 1.4px;
  text-transform: uppercase;
  margin-top: 8px;
}

.zsr-vn-dstatus {
  font: 400 var(--zt-base) var(--zf);
  font-style: italic;
  color: var(--zp-dim);
  margin-top: 10px;
}

.zsr-vn-dstatus i { font-size: var(--zt-xs); color: var(--zd-accent); margin-right: 5px; }

.zsr-vn-donline {
  display: inline-block;
  margin-top: 9px;
  padding: 2px 10px;
  border-radius: 20px;
  font: 600 var(--zt-xs) var(--zm);
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.zsr-vn-donline.on {
  background: rgba(64,208,128,.14);
  color: #40d080;
  border: 1px solid rgba(64,208,128,.3);
}

.zsr-vn-donline.off {
  background: rgba(255,255,255,.04);
  color: var(--zp-faint);
  border: 1px solid rgba(255,255,255,.07);
}

.zsr-vn-slabel {
  font: 600 var(--zt-2xs) var(--zm);
  letter-spacing: 2.2px;
  text-transform: uppercase;
  color: var(--zp-faint);
  margin-bottom: 8px;
}

.zsr-vn-hsec { margin-bottom: 16px; }

.zsr-vn-hentry {
  padding: 8px 12px;
  margin-bottom: 6px;
  border-radius: 8px;
  border-left: 2px solid var(--zd-gold-dark);
  background: rgba(255,255,255,.028);
  font: 400 var(--zt-base)/1.5 var(--zf);
  color: var(--zp-dim);
}

.zsr-vn-nsec { margin-bottom: 8px; }

.zsr-vn-notes {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 9px;
  background: rgba(0,0,0,.28);
  color: var(--zp-text);
  font: 400 var(--zt-md)/1.55 var(--zf);
  resize: vertical;
  min-height: 76px;
  transition: border-color .15s;
}

.zsr-vn-notes::placeholder { color: var(--zp-faint); }
.zsr-vn-notes:focus { border-color: var(--zd-accent); outline: none; }

.zsr-vn-nhint {
  font: 400 var(--zt-xs) var(--zm);
  letter-spacing: .8px;
  color: var(--zp-faint);
  margin-top: 5px;
  text-align: right;
}

/* ==========================================================================
    16.  GALLERY
   ========================================================================== */

.zsx-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.zsx-item {
  position: relative;
  padding: 0;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 10px;
  overflow: hidden;
  background: rgba(255,255,255,.03);
  cursor: zoom-in;
  aspect-ratio: 1;
  transition: transform .18s, border-color .18s, box-shadow .18s;
}

.zsx-item:hover {
  transform: translateY(-3px);
  border-color: var(--zd-accent);
  box-shadow: 0 0 18px -6px var(--zd-accent);
}

.zsx-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

/*
 * Who sent it.
 *
 * Top-left, opposite the caption's bottom strip, so a shared image with a
 * caption shows both without either sitting on the other.
 */
.zsx-from {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 4px 6px 10px;
  background: linear-gradient(180deg, rgba(0,0,0,.8), transparent);
  font: 500 var(--zt-2xs) var(--zf);
  color: var(--zd-accent-bright);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: left;
}

.zsx-from i { margin-right: 4px; }

.zsx-cap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 6px 4px;
  background: linear-gradient(0deg, rgba(0,0,0,.85), transparent);
  font: 400 var(--zt-xs) var(--zf);
  color: #d0dcdc;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ==========================================================================
    16b.  NOTES  (a journal, wearing the scroll's clothes)
   ========================================================================== */

.zsq-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 12px;
  margin-bottom: 7px;
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 11px;
  background: rgba(255,255,255,.02);
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color .16s, background .16s;
}

.zsq-row:hover { border-color: var(--zd-accent); background: rgba(255,255,255,.05); }

.zsq-rbody { flex: 1; min-width: 0; }

.zsq-rname {
  font: 500 var(--zt-md) var(--zf);
  color: var(--zp-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.zsq-rprev {
  margin-top: 2px;
  font: 400 var(--zt-sm) var(--zf);
  color: var(--zp-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.zsq-rmeta {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.zsq-rich { color: var(--zd-gold); font-size: 12px; }

.zsq-rtime { font: 400 var(--zt-xs) var(--zm); color: var(--zp-faint); }

.zsq-pop {
  width: 100%;
  margin-top: 14px;
  padding: 10px;
  border: 1px solid var(--zp-line);
  border-radius: 10px;
  background: rgba(200,160,48,.06);
  color: var(--zd-gold-light);
  font: 500 var(--zt-base) var(--zf);
  cursor: pointer;
  transition: background .15s, border-color .15s;
}

.zsq-pop:hover { background: rgba(200,160,48,.14); border-color: var(--zd-gold); }

.zsq-title { margin-bottom: 10px; font-weight: 500; }

/*
 * The editor.
 *
 * A textarea rather than a rich editor on purpose — see notes.mjs. `resize:
 * vertical` is deliberate too: horizontal resize inside a 480px column can only
 * make things worse, and `none` would leave a long note trapped in twelve rows.
 */
.zsq-body {
  width: 100%;
  min-height: 240px;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 10px;
  background: rgba(0,0,0,.28);
  color: var(--zp-text);
  font: 400 var(--zt-md)/var(--zt-lh) var(--zf);
  resize: vertical;
  transition: border-color .15s;
}

.zsq-body::placeholder { color: var(--zp-faint); }
.zsq-body:focus { border-color: var(--zd-accent); outline: none; }
.zsq-body:disabled, .zsq-title:disabled { opacity: .8; cursor: default; }

.zsq-state {
  margin-top: 6px;
  min-height: 1.2em;
  text-align: right;
  font: 400 var(--zt-xs) var(--zm);
  color: var(--zp-faint);
}

.zsq-locked {
  margin-top: 8px;
  padding: 9px 12px;
  border: 1px solid var(--zp-line);
  border-radius: 9px;
  background: rgba(200,160,48,.05);
  font: 400 var(--zt-sm)/var(--zt-lh) var(--zf);
  color: var(--zd-gold-light);
}

.zsq-locked i { margin-right: 6px; }

/* --- the two notebooks --- */

/*
 * A segmented control rather than the app bar's tabs: there are exactly two of
 * these and they are peers, so the choice should read as one control with a
 * lit half rather than as navigation.
 */
.zsq-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  flex-shrink: 0;
  margin: 0 16px 12px;
  padding: 4px;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px;
  background: rgba(0,0,0,.26);
}

.zsq-tab {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 8px;
  border: 0;
  border-radius: 9px;
  background: none;
  color: var(--zp-dim);
  font: 500 var(--zt-base) var(--zf);
  cursor: pointer;
  transition: background .16s, color .16s, box-shadow .16s;
}

.zsq-tab:hover { color: var(--zp-text); background: rgba(255,255,255,.04); }

.zsq-tab.on {
  color: var(--zd-accent-bright);
  background: color-mix(in srgb, var(--zd-accent) 16%, transparent);
  box-shadow: inset 0 0 0 1px var(--zd-accent);
}

.zsq-tabicon { font-size: 12px; opacity: .85; }
.zsq-tabname { letter-spacing: .3px; }

.zsq-tabcount {
  min-width: 18px;
  padding: 1px 5px;
  border-radius: 9px;
  background: rgba(255,255,255,.09);
  font: 500 var(--zt-2xs) var(--zm);
  color: var(--zp-dim);
}

.zsq-tab.on .zsq-tabcount {
  background: color-mix(in srgb, var(--zd-accent) 30%, transparent);
  color: var(--zd-accent-bright);
}

/* Who wrote it, in front of the preview, on a party note. */
.zsq-rby {
  margin-right: 6px;
  color: var(--zd-accent);
  font-weight: 500;
}

.zsq-rby::after { content: " ·"; color: var(--zp-faint); font-weight: 400; }

.zsq-rgo { color: var(--zp-faint); font-size: 11px; }

.zsq-byline {
  margin: -4px 0 10px;
  font: 400 var(--zt-xs) var(--zf);
  color: var(--zp-faint);
}

/* --- photos still in the darkroom --- */

/*
 * The tile is the photograph, washed out and desaturated rather than replaced by
 * a grey box: it is already in memory, and showing it is both a better
 * placeholder and an honest preview of what is about to land.
 */
.zsx-dev { cursor: default; }

.zsx-dev img {
  filter: grayscale(.7) brightness(.5) blur(1px);
  transition: filter .3s;
}

.zsx-dev::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 30%,
              color-mix(in srgb, var(--zd-accent) 22%, transparent) 50%, transparent 70%);
  background-size: 260% 100%;
  animation: zsdev 1.9s ease-in-out infinite;
  pointer-events: none;
}

@keyframes zsdev {
  from { background-position: 160% 0; }
  to   { background-position: -60% 0; }
}

.zsx-devlabel {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  z-index: 2;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font: 500 var(--zt-2xs) var(--zm);
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--zd-accent-bright);
  text-shadow: 0 1px 4px rgba(0,0,0,.9);
}

.zsx-devspin {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--zd-accent) 35%, transparent);
  border-top-color: var(--zd-accent-bright);
  animation: zsspin .8s linear infinite;
}

@keyframes zsspin { to { transform: rotate(360deg); } }

.zsx-devfail { cursor: pointer; border-color: rgba(224,96,96,.45); }
.zsx-devfail::after { animation: none; background: rgba(40,10,10,.45); }
.zsx-devfail .zsx-devlabel { color: #f0a0a0; }
.zsx-devfail img { filter: grayscale(1) brightness(.32); }

.zsc-out {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 12px;
  padding: 9px 12px;
  border: 1px solid var(--zp-line);
  border-radius: 9px;
  background: rgba(200,160,48,.05);
  font: 400 var(--zt-sm) var(--zf);
  color: var(--zd-gold-light);
}

/* ==========================================================================
    16c.  CAMERA
   ========================================================================== */

.zsc-view {
  position: relative;
  aspect-ratio: 16 / 10;
  margin-bottom: 12px;
  border: 1px solid var(--zp-line);
  border-radius: 12px;
  overflow: hidden;
  background: #030a0e;
  display: flex;
  align-items: center;
  justify-content: center;
}

.zsc-shot { width: 100%; height: 100%; object-fit: contain; display: block; }

/* The empty viewfinder: four corner brackets and a lens, and nothing else. */
.zsc-finder {
  position: absolute;
  inset: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--zp-faint);
}

.zsc-fi { font-size: 30px; opacity: .35; }

.zsc-fc {
  position: absolute;
  width: 20px;
  height: 20px;
  border: 2px solid var(--zd-accent);
  opacity: .5;
}

.zsc-tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
.zsc-tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
.zsc-bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
.zsc-br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }

.zsc-shutter {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--zd-accent);
  border-radius: 12px;
  background: color-mix(in srgb, var(--zd-accent) 12%, transparent);
  color: var(--zd-accent-bright);
  font: 600 var(--zt-md) var(--zf);
  letter-spacing: 1px;
  cursor: pointer;
  transition: background .16s, box-shadow .16s;
}

.zsc-shutter:hover {
  background: color-mix(in srgb, var(--zd-accent) 22%, transparent);
  box-shadow: 0 0 22px -8px var(--zd-accent);
}

.zsc-ring {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid var(--zd-accent);
  background: color-mix(in srgb, var(--zd-accent) 35%, transparent);
}

.zsc-row { display: flex; gap: 8px; margin-top: 12px; }

.zsc-keep,
.zsc-retake {
  flex: 1;
